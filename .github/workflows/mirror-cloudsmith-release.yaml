name: Mirror stable release to Cloudsmith

on:
  workflow_run:
    workflows: [Release Platform Package]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: Published stable platform version (without v)
        required: true
        type: string
      publish:
        description: Upload after verification (also requires CLOUDSMITH_PUBLISH_ENABLED)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare:
    if: >-
      github.repository == 'eqtylab/deployment' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.repository.full_name == 'eqtylab/deployment' &&
        github.event.workflow_run.head_repository.full_name == 'eqtylab/deployment' &&
        github.event.workflow_run.path == '.github/workflows/release-platform-package.yaml'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: read
      attestations: read
    outputs:
      version: ${{ steps.inventory.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Isolate registry credentials
        run: |
          echo "DOCKER_CONFIG=$RUNNER_TEMP/mirror-docker" >> "$GITHUB_ENV"
          echo "HELM_REGISTRY_CONFIG=$RUNNER_TEMP/mirror-helm/config.json" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select successful stable publication
        id: select
        env:
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            echo 'selected=true' >> "$GITHUB_OUTPUT"
          else
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --paginate --slurp \
              --jq "[.[].artifacts[] | select(.name == \"stable-publication-$ATTEMPT\" and .expired == false)] | length")
            if [ "$count" = 1 ]; then
              echo 'selected=true' >> "$GITHUB_OUTPUT"
            else
              echo 'No stable publication receipt; skipping dry-run/prerelease/unpublished run.'
            fi
          fi
      - name: Download publication receipt
        if: steps.select.outputs.selected == 'true' && github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: stable-publication-${{ github.event.workflow_run.run_attempt }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/publication-receipt
      - uses: actions/setup-python@v6
        if: steps.select.outputs.selected == 'true'
        with:
          python-version: '3.12'
      - name: Install parsing dependencies
        if: steps.select.outputs.selected == 'true'
        run: python -m pip install PyYAML==6.0.3
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1
        if: steps.select.outputs.selected == 'true'
        with:
          version: '1.3.4'
      - uses: sigstore/cosign-installer@v4
        if: steps.select.outputs.selected == 'true'
        with:
          cosign-release: v3.1.3
      - name: Authenticate to GitHub registry (read only)
        if: steps.select.outputs.selected == 'true'
        run: |
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Prepare and verify inventory without Cloudsmith access
        if: steps.select.outputs.selected == 'true'
        id: inventory
        env:
          VERSION: ${{ inputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          args=(--version "$VERSION")
          if [ "$EVENT" = workflow_run ]; then
            args=(--receipt "$RUNNER_TEMP/publication-receipt/release-publication.json")
          fi
          python -B scripts/release/cloudsmith_release.py prepare \
            "${args[@]}" --work "$RUNNER_TEMP/cloudsmith-delivery"
          {
            echo '### Cloudsmith inventory (no uploads)'
            echo '```json'
            cat "$RUNNER_TEMP/cloudsmith-delivery/inventory.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: steps.inventory.outputs.version != ''
        with:
          name: cloudsmith-inventory
          path: ${{ runner.temp }}/cloudsmith-delivery
          if-no-files-found: error
          retention-days: 14
      - name: Remove registry credentials
        if: always()
        run: |
          if command -v oras >/dev/null; then oras logout ghcr.io; fi

  publish:
    needs: prepare
    if: >-
      needs.prepare.outputs.version != '' && vars.CLOUDSMITH_PUBLISH_ENABLED == 'true' &&
      (github.event_name == 'workflow_run' || inputs.publish == true)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: platform-release-platform/v${{ needs.prepare.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDSMITH_PUBLISH_ENABLED: ${{ vars.CLOUDSMITH_PUBLISH_ENABLED }}
      CLOUDSMITH_PUBLISH_REQUESTED: 'true'
    steps:
      - name: Isolate registry credentials
        run: |
          echo "DOCKER_CONFIG=$RUNNER_TEMP/mirror-docker" >> "$GITHUB_ENV"
          echo "HELM_REGISTRY_CONFIG=$RUNNER_TEMP/mirror-helm/config.json" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3 jsonschema==4.26.0
      - name: Check publication context before authentication
        run: |
          PYTHONPATH=scripts/release python -c 'import os; from publish_cloudsmith import require_publish_context; require_publish_context(os.environ)'
      - uses: actions/download-artifact@v4
        with:
          name: cloudsmith-inventory
          path: ${{ runner.temp }}/cloudsmith-delivery
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1
        with:
          version: '1.3.4'
      - uses: azure/setup-helm@v4
        with:
          version: v3.20.0
      - name: Authenticate with deployment's production OIDC policy
        uses: cloudsmith-io/cloudsmith-cli-action@69e169e2ad9bc9a1599c2dff464061a00fe9f8ba # v3
        with:
          cli-version: '1.27.0'
          oidc-namespace: eqtylab
          oidc-service-slug: github_deployment_ci
          oidc-audience: https://github.com/eqtylab
          export-auth-token: 'true'
          verify-auth: 'true'
      - name: Authenticate registries
        run: |
          mkdir -p "$DOCKER_CONFIG" "$(dirname "$HELM_REGISTRY_CONFIG")"
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$CLOUDSMITH_API_KEY" | oras login docker.cloudsmith.io --username "$CLOUDSMITH_USERNAME" --password-stdin
          printf '%s' "$CLOUDSMITH_API_KEY" | oras login helm.oci.cloudsmith.io --username "$CLOUDSMITH_USERNAME" --password-stdin
          printf '%s' "$CLOUDSMITH_API_KEY" | helm registry login helm.oci.cloudsmith.io --username "$CLOUDSMITH_USERNAME" --password-stdin
      - name: Mirror exact artifacts and verify delivery
        run: python -B scripts/release/publish_cloudsmith.py --work "$RUNNER_TEMP/cloudsmith-delivery"
      - name: Report verified delivery
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: echo "Cloudsmith prod delivery for v$VERSION verified. See cloudsmith-delivery.json on the GitHub release." >> "$GITHUB_STEP_SUMMARY"
      - name: Remove registry credentials
        if: always()
        run: |
          if command -v oras >/dev/null; then
            for host in ghcr.io docker.cloudsmith.io helm.oci.cloudsmith.io; do oras logout "$host"; done
          fi
          if command -v helm >/dev/null; then helm registry logout helm.oci.cloudsmith.io; fi
