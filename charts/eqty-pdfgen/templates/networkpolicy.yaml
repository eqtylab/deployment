{{- if and .Values.enabled .Values.networkPolicy.enabled }}
{{- if not .Values.networkPolicy.ingress }}
{{- fail "networkPolicy.ingress must list at least one rule when networkPolicy.enabled=true (an empty list blocks Governance Service from reaching PDFgen)" }}
{{- end }}
{{- if not .Values.networkPolicy.egress }}
{{- fail "networkPolicy.egress must list at least one rule when networkPolicy.enabled=true (an empty list blocks DNS and the signing endpoint)" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "eqty-pdfgen.fullname" . }}
  labels:
    {{- include "eqty-pdfgen.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "eqty-pdfgen.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  {{- with .Values.networkPolicy.ingress }}
  ingress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.networkPolicy.egress }}
  egress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
