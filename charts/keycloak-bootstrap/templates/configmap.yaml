{{- if .Values.bootstrap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "keycloak-bootstrap.fullname" . }}-scripts
  labels:
    {{- include "keycloak-bootstrap.labels" . | nindent 4 }}
# trivy:ignore:KSV-0109 scripts reference secret names via env vars, not actual values
data:
  bootstrap.sh: |
    #!/bin/sh
    set -e

    # Configuration from environment
    KEYCLOAK_URL="${KEYCLOAK_URL}"
    KEYCLOAK_ADMIN="${KEYCLOAK_ADMIN_USERNAME}"
    KEYCLOAK_ADMIN_PASSWORD="${KEYCLOAK_ADMIN_PASSWORD}"
    REALM_NAME="{{ .Values.keycloak.realm.name }}"

    echo "Starting Keycloak bootstrap process..."
    echo "Keycloak URL: ${KEYCLOAK_URL}"
    echo "Realm: ${REALM_NAME}"

    # Function to get admin token
    get_admin_token() {
      echo "Getting admin token..."
      TOKEN=$(curl -s -X POST "${KEYCLOAK_URL}/realms/master/protocol/openid-connect/token" \
        -H "Content-Type: application/x-www-form-urlencoded" \
        -d "username=${KEYCLOAK_ADMIN}" \
        -d "password=${KEYCLOAK_ADMIN_PASSWORD}" \
        -d "grant_type=password" \
        -d "client_id=admin-cli" | jq -r '.access_token')

      if [ "$TOKEN" = "null" ] || [ -z "$TOKEN" ]; then
        echo "Failed to get admin token"
        return 1
      fi
      echo "Successfully obtained admin token"
      return 0
    }

    # Function to check if realm exists
    check_realm_exists() {
      echo "Checking if realm ${REALM_NAME} exists..."
      RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
        -H "Authorization: Bearer ${TOKEN}" \
        "${KEYCLOAK_URL}/admin/realms/${REALM_NAME}")

      if [ "$RESPONSE" = "200" ]; then
        echo "Realm ${REALM_NAME} already exists"
        return 0
      else
        echo "Realm ${REALM_NAME} does not exist"
        return 1
      fi
    }

    # Function to create realm
    create_realm() {
      echo "Creating realm ${REALM_NAME}..."
      REALM_CONFIG=$(cat <<EOF
    {
      "realm": "${REALM_NAME}",
      "displayName": {{ .Values.keycloak.realm.displayName | toJson }},
      "displayNameHtml": {{ .Values.keycloak.realm.displayNameHtml | toJson }},
      "enabled": true,
      "registrationAllowed": {{ .Values.keycloak.realm.registrationAllowed }},
      "loginWithEmailAllowed": {{ .Values.keycloak.realm.loginWithEmailAllowed }},
      "duplicateEmailsAllowed": false,
      "resetPasswordAllowed": {{ .Values.keycloak.realm.resetPasswordAllowed }},
      "rememberMe": {{ .Values.keycloak.realm.rememberMe }},
      "verifyEmail": {{ .Values.keycloak.realm.verifyEmail }},
      "sslRequired": "{{ .Values.keycloak.realm.sslRequired }}",
      "bruteForceProtected": {{ .Values.keycloak.realm.bruteForceProtected }},
      "accessTokenLifespan": {{ .Values.keycloak.tokens.accessTokenLifespan }},
      "ssoSessionIdleTimeout": {{ .Values.keycloak.tokens.ssoSessionIdleTimeout }},
      "ssoSessionMaxLifespan": {{ .Values.keycloak.tokens.ssoSessionMaxLifespan }},
      "internationalizationEnabled": false,
      "defaultSignatureAlgorithm": "RS256"
    }
    EOF
    )

      RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${KEYCLOAK_URL}/admin/realms" \
        -H "Authorization: Bearer ${TOKEN}" \
        -H "Content-Type: application/json" \
        -d "${REALM_CONFIG}")

      if [ "$RESPONSE" = "201" ]; then
        echo "Realm created successfully"
        return 0
      else
        echo "Failed to create realm. Response code: $RESPONSE"
        return 1
      fi
    }

    # Function to create client scope
    create_client_scope() {
      local SCOPE_NAME=$1
      local SCOPE_DESC=$2

      echo "Creating client scope: ${SCOPE_NAME}..."
      SCOPE_CONFIG=$(cat <<EOF
    {
      "name": "${SCOPE_NAME}",
      "description": "${SCOPE_DESC}",
      "protocol": "openid-connect",
      "attributes": {
        "include.in.token.scope": "true",
        "display.on.consent.screen": "true"
      }
    }
    EOF
    )

      RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
        "${KEYCLOAK_URL}/admin/realms/${REALM_NAME}/client-scopes" \
        -H "Authorization: Bearer ${TOKEN}" \
        -H "Content-Type: application/json" \
        -d "${SCOPE_CONFIG}")

      if [ "$RESPONSE" = "201" ]; then
        echo "  Created scope: ${SCOPE_NAME}"
      elif [ "$RESPONSE" = "409" ]; then
        echo "  Scope already exists: ${SCOPE_NAME}"
      else
        echo "  Failed to create scope: ${SCOPE_NAME} (Response: $RESPONSE)"
      fi
    }

    # Function to get a client scope ID by name
    get_client_scope_id() {
      local SCOPE_NAME=$1
      curl -s \
        -H "Authorization: Bearer ${TOKEN}" \
        "${KEYCLOAK_URL}/admin/realms/${REALM_NAME}/client-scopes" | jq -r --arg name "$SCOPE_NAME" '.[] | select(.name == $name) | .id'
    }

    # Function to add a protocol mapper to a client scope
    add_protocol_mapper_to_scope() {
      local SCOPE_NAME=$1
      local MAPPER_NAME=$2
      local MAPPER_TYPE=$3
      local MAPPER_CONFIG=$4

      SCOPE_ID=$(get_client_scope_id "$SCOPE_NAME")
      if [ -z "$SCOPE_ID" ] || [ "$SCOPE_ID" = "null" ]; then
        echo "  Scope ${SCOPE_NAME} not found, skipping mapper"
        return 1
      fi

      echo "  Adding mapper '${MAPPER_NAME}' to scope '${SCOPE_NAME}'..."
      MAPPER_JSON=$(cat <<EOF
    {
      "name": "${MAPPER_NAME}",
      "protocol": "openid-connect",
      "protocolMapper": "${MAPPER_TYPE}",
      "config": ${MAPPER_CONFIG}
    }
    EOF
    )

      RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
        "${KEYCLOAK_URL}/admin/realms/${REALM_NAME}/client-scopes/${SCOPE_ID}/protocol-mappers/models" \
        -H "Authorization: Bearer ${TOKEN}" \
        -H "Content-Type: application/json" \
        -d "${MAPPER_JSON}")

      if [ "$RESPONSE" = "201" ]; then
        echo "  Mapper '${MAPPER_NAME}' added successfully"
      elif [ "$RESPONSE" = "409" ]; then
        echo "  Mapper '${MAPPER_NAME}' already exists"
      else
        echo "  Failed to add mapper '${MAPPER_NAME}' (Response: $RESPONSE)"
      fi
    }

    # Function to set a scope as a realm-level default scope
    # This sets the "Assigned type" to "Default" so it's added to all new clients
    set_realm_default_scope() {
      local SCOPE_NAME=$1

      SCOPE_ID=$(get_client_scope_id "$SCOPE_NAME")
      if [ -z "$SCOPE_ID" ] || [ "$SCOPE_ID" = "null" ]; then
        echo "  Scope ${SCOPE_NAME} not found"
        return 1
      fi

      echo "  Setting scope '${SCOPE_NAME}' as realm default..."
      RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
        "${KEYCLOAK_URL}/admin/realms/${REALM_NAME}/default-default-client-scopes/${SCOPE_ID}" \
        -H "Authorization: Bearer ${TOKEN}")

      if [ "$RESPONSE" = "204" ]; then
        echo "  Scope '${SCOPE_NAME}' set as realm default"
      elif [ "$RESPONSE" = "409" ]; then
        echo "  Scope '${SCOPE_NAME}' is already a realm default"
      else
        echo "  Failed to set realm default scope (Response: $RESPONSE)"
      fi
    }

    # Function to print the entries added to and removed from a JSON array
    log_list_change() {
      local FIELD=$1
      local OLD=$2
      local NEW=$3

      ADDED=$(jq -n -r --argjson old "$OLD" --argjson new "$NEW" '($new - $old) | join(", ")')
      REMOVED=$(jq -n -r --argjson old "$OLD" --argjson new "$NEW" '($old - $new) | join(", ")')
      if [ -n "$ADDED" ]; then
        echo "  ${FIELD}: added ${ADDED}"
      fi
      if [ -n "$REMOVED" ]; then
        echo "  ${FIELD}: removed ${REMOVED}"
      fi
      return 0
    }

    # Function to fail when any of the named client scopes is missing from the realm
    # openid is requested by clients and is not a Keycloak client scope
    require_client_scopes() {
      local WANTED=$1

      MISSING=$(curl -s \
        -H "Authorization: Bearer ${TOKEN}" \
        "${KEYCLOAK_URL}/admin/realms/${REALM_NAME}/client-scopes" | jq -r --argjson want "$WANTED" \
        '[.[].name] as $all | [$want[] | select(. != "openid") | select(. as $n | $all | index($n) | not)] | join(", ")')
      if [ -n "$MISSING" ]; then
        echo "  Client scopes not found in the realm: ${MISSING}"
        return 1
      fi
      return 0
    }

    # Function to make a client's default or optional scopes match the values
    # openid is requested by clients and is not a Keycloak client scope;
    # service_account is managed by Keycloak for clients with service accounts
    sync_client_scopes() {
      local CLIENT_UUID=$1
      local KIND=$2
      local WANTED=$3
      local SCOPES_URL="${KEYCLOAK_URL}/admin/realms/${REALM_NAME}/clients/${CLIENT_UUID}/${KIND}-client-scopes"

      ALL_SCOPES=$(curl -s \
        -H "Authorization: Bearer ${TOKEN}" \
        "${KEYCLOAK_URL}/admin/realms/${REALM_NAME}/client-scopes")
      DESIRED=$(echo "$ALL_SCOPES" | jq -c --argjson want "$WANTED" '[.[].name | select(. as $n | $want | index($n))]')
      CURRENT=$(curl -s \
        -H "Authorization: Bearer ${TOKEN}" \
        "${SCOPES_URL}" | jq -c '[.[].name | select(. != "service_account")]')

      log_list_change "${KIND} scopes" "$CURRENT" "$DESIRED"
      for NAME in $(jq -n -r --argjson old "$CURRENT" --argjson new "$DESIRED" '($old - $new)[]'); do
        SCOPE_ID=$(echo "$ALL_SCOPES" | jq -r --arg name "$NAME" '.[] | select(.name == $name) | .id')
        RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE "${SCOPES_URL}/${SCOPE_ID}" \
          -H "Authorization: Bearer ${TOKEN}")
        if [ "$RESPONSE" != "204" ]; then
          echo "  Failed to remove ${KIND} scope ${NAME} (Response: $RESPONSE)"
        fi
      done
      for NAME in $(jq -n -r --argjson old "$CURRENT" --argjson new "$DESIRED" '($new - $old)[]'); do
        SCOPE_ID=$(echo "$ALL_SCOPES" | jq -r --arg name "$NAME" '.[] | select(.name == $name) | .id')
        RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X PUT "${SCOPES_URL}/${SCOPE_ID}" \
          -H "Authorization: Bearer ${TOKEN}")
        if [ "$RESPONSE" != "204" ]; then
          echo "  Failed to add ${KIND} scope ${NAME} (Response: $RESPONSE)"
        fi
      done
      return 0
    }

    # Function to update an existing client from the values, leaving its secret and enabled state unchanged
    update_client() {
      local CLIENT_ID=$1
      local CLIENT_CONFIG=$2

      EXISTING=$(curl -s \
        -H "Authorization: Bearer ${TOKEN}" \
        "${KEYCLOAK_URL}/admin/realms/${REALM_NAME}/clients?clientId=${CLIENT_ID}" | jq -c '.[0]')
      CLIENT_UUID=$(echo "$EXISTING" | jq -r '.id')
      if [ -z "$CLIENT_UUID" ] || [ "$CLIENT_UUID" = "null" ]; then
        echo "  Failed to get client ${CLIENT_ID} for update"
        return 1
      fi

      DESIRED=$(echo "$CLIENT_CONFIG" | jq -c 'del(.clientId, .secret, .enabled, .defaultClientScopes, .optionalClientScopes)')
      for FIELD in redirectUris webOrigins; do
        log_list_change "$FIELD" "$(echo "$EXISTING" | jq -c ".${FIELD} // []")" "$(echo "$DESIRED" | jq -c ".${FIELD}")"
      done
      echo "$DESIRED" | jq -r --argjson old "$EXISTING" \
        'to_entries[] | select(.value | type != "array") | select($old[.key] != .value) | "  \(.key): \($old[.key]) -> \(.value)"'

      UPDATED=$(echo "$EXISTING" | jq -c --argjson desired "$DESIRED" '. + $desired')
      if [ "$(echo "$EXISTING" | jq -S -c .)" = "$(echo "$UPDATED" | jq -S -c .)" ]; then
        echo "  Client settings already match the values"
      else
        RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
          "${KEYCLOAK_URL}/admin/realms/${REALM_NAME}/clients/${CLIENT_UUID}" \
          -H "Authorization: Bearer ${TOKEN}" \
          -H "Content-Type: application/json" \
          -d "${UPDATED}")
        if [ "$RESPONSE" != "204" ]; then
          echo "  Failed to update client. Response code: $RESPONSE"
          return 1
        fi
        echo "  Client updated from the values"
      fi

      sync_client_scopes "$CLIENT_UUID" default "$(echo "$CLIENT_CONFIG" | jq -c '.defaultClientScopes')"
      sync_client_scopes "$CLIENT_UUID" optional "$(echo "$CLIENT_CONFIG" | jq -c '.optionalClientScopes')"
    }

    # Function to create client
    create_client() {
      local CLIENT_ID=$1
      local CLIENT_NAME=$2
      local CLIENT_DESC=$3
      local PUBLIC_CLIENT=$4
      local SERVICE_ACCOUNT=$5
      local CLIENT_SECRET=$6
      local REDIRECT_URIS=$7
      local WEB_ORIGINS=$8
      local DEFAULT_SCOPES=$9
      local OPTIONAL_SCOPES=${10}

      echo "Creating client: ${CLIENT_ID}..."

      # Build redirect URIs array
      REDIRECT_URIS_JSON="[]"
      if [ -n "$REDIRECT_URIS" ]; then
        REDIRECT_URIS_JSON=$(echo "$REDIRECT_URIS" | jq -R -s -c 'split(",") | map(gsub("^\\s+|\\s+$";""))')
      fi

      # Build web origins array
      WEB_ORIGINS_JSON="[]"
      if [ -n "$WEB_ORIGINS" ]; then
        WEB_ORIGINS_JSON=$(echo "$WEB_ORIGINS" | jq -R -s -c 'split(",") | map(gsub("^\\s+|\\s+$";""))')
      fi

      # Build scope arrays
      DEFAULT_SCOPES_JSON=$(printf '%s' "$DEFAULT_SCOPES" | jq -R -s -c 'split(",") | map(select(. != ""))')
      OPTIONAL_SCOPES_JSON=$(printf '%s' "$OPTIONAL_SCOPES" | jq -R -s -c 'split(",") | map(select(. != ""))')
      require_client_scopes "$DEFAULT_SCOPES_JSON" || return 1
      require_client_scopes "$OPTIONAL_SCOPES_JSON" || return 1

      CLIENT_CONFIG=$(cat <<EOF
    {
      "clientId": "${CLIENT_ID}",
      "name": "${CLIENT_NAME}",
      "description": "${CLIENT_DESC}",
      "enabled": true,
      "publicClient": ${PUBLIC_CLIENT},
      "serviceAccountsEnabled": ${SERVICE_ACCOUNT},
      "standardFlowEnabled": true,
      "implicitFlowEnabled": false,
      "directAccessGrantsEnabled": true,
      "protocol": "openid-connect",
      "redirectUris": ${REDIRECT_URIS_JSON},
      "webOrigins": ${WEB_ORIGINS_JSON},
      "defaultClientScopes": ${DEFAULT_SCOPES_JSON},
      "optionalClientScopes": ${OPTIONAL_SCOPES_JSON}
    }
    EOF
    )

      # Add secret if not public client
      if [ "$PUBLIC_CLIENT" = "false" ] && [ -n "$CLIENT_SECRET" ]; then
        CLIENT_CONFIG=$(echo "$CLIENT_CONFIG" | jq --arg secret "$CLIENT_SECRET" '. + {secret: $secret}')
      fi

      RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
        "${KEYCLOAK_URL}/admin/realms/${REALM_NAME}/clients" \
        -H "Authorization: Bearer ${TOKEN}" \
        -H "Content-Type: application/json" \
        -d "${CLIENT_CONFIG}")

      if [ "$RESPONSE" = "201" ]; then
        echo "  Client created successfully"
        return 0
      elif [ "$RESPONSE" = "409" ]; then
        echo "  Client already exists; updating it from the values"
        update_client "$CLIENT_ID" "$CLIENT_CONFIG"
        return $?
      else
        echo "  Failed to create client. Response code: $RESPONSE"
        return 1
      fi
    }

    # Function to assign service account roles
    assign_service_account_roles() {
      local CLIENT_ID=$1
      local TARGET_CLIENT_ID=$2
      local ROLES=$3

      echo "Assigning service account roles for ${CLIENT_ID}..."

      # Get the client's internal ID
      CLIENT_UUID=$(curl -s \
        -H "Authorization: Bearer ${TOKEN}" \
        "${KEYCLOAK_URL}/admin/realms/${REALM_NAME}/clients?clientId=${CLIENT_ID}" | jq -r '.[0].id')

      if [ "$CLIENT_UUID" = "null" ] || [ -z "$CLIENT_UUID" ]; then
        echo "  Failed to get client UUID for ${CLIENT_ID}"
        return 1
      fi

      # Get the service account user ID
      SERVICE_ACCOUNT_USER=$(curl -s \
        -H "Authorization: Bearer ${TOKEN}" \
        "${KEYCLOAK_URL}/admin/realms/${REALM_NAME}/clients/${CLIENT_UUID}/service-account-user")

      SERVICE_ACCOUNT_USER_ID=$(echo "$SERVICE_ACCOUNT_USER" | jq -r '.id')

      if [ "$SERVICE_ACCOUNT_USER_ID" = "null" ] || [ -z "$SERVICE_ACCOUNT_USER_ID" ]; then
        echo "  Failed to get service account user for ${CLIENT_ID}"
        return 1
      fi

      # Get the target client's internal ID (e.g., realm-management)
      TARGET_CLIENT_UUID=$(curl -s \
        -H "Authorization: Bearer ${TOKEN}" \
        "${KEYCLOAK_URL}/admin/realms/${REALM_NAME}/clients?clientId=${TARGET_CLIENT_ID}" | jq -r '.[0].id')

      if [ "$TARGET_CLIENT_UUID" = "null" ] || [ -z "$TARGET_CLIENT_UUID" ]; then
        echo "  Failed to get client UUID for ${TARGET_CLIENT_ID}"
        return 1
      fi

      # Get available roles from the target client
      AVAILABLE_ROLES=$(curl -s \
        -H "Authorization: Bearer ${TOKEN}" \
        "${KEYCLOAK_URL}/admin/realms/${REALM_NAME}/clients/${TARGET_CLIENT_UUID}/roles")

      # Build the roles array to assign
      ROLES_TO_ASSIGN="["
      FIRST=true
      for ROLE_NAME in $(echo "$ROLES" | tr ',' ' '); do
        ROLE_OBJ=$(echo "$AVAILABLE_ROLES" | jq -c --arg name "$ROLE_NAME" '.[] | select(.name == $name)')

        if [ -n "$ROLE_OBJ" ] && [ "$ROLE_OBJ" != "null" ]; then
          if [ "$FIRST" = "true" ]; then
            FIRST=false
          else
            ROLES_TO_ASSIGN="${ROLES_TO_ASSIGN},"
          fi
          ROLES_TO_ASSIGN="${ROLES_TO_ASSIGN}${ROLE_OBJ}"
          echo "  Found role: ${ROLE_NAME}"
        else
          echo "  Warning: Role ${ROLE_NAME} not found in ${TARGET_CLIENT_ID}"
        fi
      done
      ROLES_TO_ASSIGN="${ROLES_TO_ASSIGN}]"

      # Assign the roles to the service account
      RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
        "${KEYCLOAK_URL}/admin/realms/${REALM_NAME}/users/${SERVICE_ACCOUNT_USER_ID}/role-mappings/clients/${TARGET_CLIENT_UUID}" \
        -H "Authorization: Bearer ${TOKEN}" \
        -H "Content-Type: application/json" \
        -d "${ROLES_TO_ASSIGN}")

      if [ "$RESPONSE" = "204" ]; then
        echo "  Service account roles assigned successfully"
        return 0
      else
        echo "  Failed to assign roles. Response code: $RESPONSE"
        return 1
      fi
    }

    # Function to add an attribute to the realm user profile if not already present
    add_user_profile_attribute() {
      local ATTR_NAME=$1
      local ATTR_CONFIG=$2

      echo "Adding user profile attribute: ${ATTR_NAME}..."

      PROFILE=$(curl -s \
        -H "Authorization: Bearer ${TOKEN}" \
        "${KEYCLOAK_URL}/admin/realms/${REALM_NAME}/users/profile")

      if [ -z "$PROFILE" ] || ! echo "$PROFILE" | jq -e '.attributes' > /dev/null 2>&1; then
        echo "  Failed to get user profile configuration"
        return 1
      fi

      if echo "$PROFILE" | jq -e --arg name "$ATTR_NAME" '.attributes[] | select(.name == $name)' > /dev/null; then
        echo "  User profile attribute already exists: ${ATTR_NAME}"
        return 0
      fi

      UPDATED_PROFILE=$(echo "$PROFILE" | jq -c --argjson attr "$ATTR_CONFIG" '.attributes += [$attr]')

      RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
        "${KEYCLOAK_URL}/admin/realms/${REALM_NAME}/users/profile" \
        -H "Authorization: Bearer ${TOKEN}" \
        -H "Content-Type: application/json" \
        -d "${UPDATED_PROFILE}")

      if [ "$RESPONSE" = "200" ]; then
        echo "  User profile attribute added: ${ATTR_NAME}"
        return 0
      else
        echo "  Failed to add user profile attribute: ${ATTR_NAME} (Response: $RESPONSE)"
        return 1
      fi
    }

    # Function to create user
    create_user() {
      local USERNAME=$1
      local EMAIL=$2
      local FIRST_NAME=$3
      local LAST_NAME=$4
      local PASSWORD=$5
      local TEMP_PASSWORD=$6
      local EMAIL_VERIFIED=$7

      echo "Creating user: ${USERNAME}..."

      USER_CONFIG=$(cat <<EOF
    {
      "username": "${USERNAME}",
      "email": "${EMAIL}",
      "emailVerified": ${EMAIL_VERIFIED},
      "enabled": true,
      "firstName": "${FIRST_NAME}",
      "lastName": "${LAST_NAME}",
      "credentials": [{
        "type": "password",
        "value": "${PASSWORD}",
        "temporary": ${TEMP_PASSWORD}
      }]
    }
    EOF
    )

      RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
        "${KEYCLOAK_URL}/admin/realms/${REALM_NAME}/users" \
        -H "Authorization: Bearer ${TOKEN}" \
        -H "Content-Type: application/json" \
        -d "${USER_CONFIG}")

      if [ "$RESPONSE" = "201" ]; then
        echo "  User created successfully"
        return 0
      elif [ "$RESPONSE" = "409" ]; then
        echo "  User already exists"
        return 0
      else
        echo "  Failed to create user. Response code: $RESPONSE"
        return 1
      fi
    }

    # Main bootstrap process
    main() {
      # Get admin token
      if ! get_admin_token; then
        echo "Failed to authenticate with Keycloak"
        exit 1
      fi

      # Create or update realm
      if ! check_realm_exists; then
        if ! create_realm; then
          echo "Failed to create realm"
          exit 1
        fi
      fi

      # Add user profile attributes
      {{- range .Values.userProfile.attributes }}
      add_user_profile_attribute "{{ .name }}" '{{ . | toJson }}'
      {{- end }}

      # Create client scopes
      {{- range .Values.scopes }}
      create_client_scope "{{ .name }}" "{{ .description }}"
      {{- end }}

      {{- with .Values.clients.frontend }}
      # Create the frontend client's custom scopes with mappers
      {{- range .customScopes }}
      {{- $scopeName := .name }}
      create_client_scope "{{ .name }}" "{{ .description }}"
      {{- range .mappers }}
      add_protocol_mapper_to_scope "{{ $scopeName }}" "{{ .name }}" "{{ .protocolMapper }}" '{{ .config | toJson }}'
      {{- end }}
      set_realm_default_scope "{{ .name }}"
      {{- end }}

      # Create frontend client
      create_client \
        "{{ .clientId }}" \
        "{{ .name }}" \
        "{{ .description }}" \
        "{{ .publicClient }}" \
        "false" \
        "" \
        "{{ join "," .redirectUris }}" \
        "{{ join "," .webOrigins }}" \
        "{{ include "keycloak-bootstrap.defaultScopes" . }}" \
        "{{ include "keycloak-bootstrap.optionalScopes" . }}"
      {{- end }}

      # Create backend client (secret auto-generated by Keycloak)
      {{- with .Values.clients.backend }}
      create_client \
        "{{ .clientId }}" \
        "{{ .name }}" \
        "{{ .description }}" \
        "{{ .publicClient }}" \
        "{{ .serviceAccountsEnabled }}" \
        "" \
        "{{ join "," .redirectUris }}" \
        "{{ join "," .webOrigins }}" \
        "{{ include "keycloak-bootstrap.defaultScopes" . }}" \
        "{{ include "keycloak-bootstrap.optionalScopes" . }}"

      # Assign service account roles for backend client
      {{- if and .serviceAccountsEnabled .serviceAccountRoles }}
      {{- range .serviceAccountRoles }}
      assign_service_account_roles \
        "{{ $.Values.clients.backend.clientId }}" \
        "{{ .clientId }}" \
        "{{ join "," .roles }}"
      {{- end }}
      {{- end }}
      {{- end }}

      # Create worker client (secret auto-generated by Keycloak)
      {{- with .Values.clients.worker }}
      create_client \
        "{{ .clientId }}" \
        "{{ .name }}" \
        "{{ .description }}" \
        "{{ .publicClient }}" \
        "{{ .serviceAccountsEnabled }}" \
        "" \
        "" \
        "" \
        "{{ include "keycloak-bootstrap.defaultScopes" . }}" \
        "{{ include "keycloak-bootstrap.optionalScopes" . }}"
      {{- end }}

      # Create admin user
      {{- if .Values.users.admin.enabled }}
      ADMIN_PASSWORD="${ADMIN_USER_PASSWORD}"
      create_user \
        "{{ .Values.users.admin.username }}" \
        "{{ .Values.users.admin.email }}" \
        "{{ .Values.users.admin.firstName }}" \
        "{{ .Values.users.admin.lastName }}" \
        "${ADMIN_PASSWORD}" \
        "{{ .Values.users.admin.temporaryPassword }}" \
        "{{ .Values.users.admin.emailVerified }}"
      {{- end }}

      # Create test users
      {{- if .Values.users.testUsers.enabled }}
      {{- range .Values.users.testUsers.users }}
      create_user \
        "{{ .username }}" \
        "{{ .email }}" \
        "{{ .firstName }}" \
        "{{ .lastName }}" \
        "{{ .password }}" \
        "false" \
        "true"
      {{- end }}
      {{- end }}

      echo "Keycloak bootstrap completed successfully!"

    }

    # Run main function
    main
{{- end }}
