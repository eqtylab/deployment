# Keycloak Configuration Example
# Minimal configuration for deploying Guardian with Keycloak
# For all available values, see the chart's values.yaml and README.md
#
# Usage:
#   Set these values under the `guardian:` key in your umbrella values file

image:
  tag: ""
  pullPolicy: Always

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
  hosts:
    - host: "guardian.your-domain.com"
      paths:
        - path: "/"
          pathType: "Prefix"
  tls:
    - secretName: "guardian-tls"
      hosts:
        - "guardian.your-domain.com"

config:
  # Keycloak Configuration
  keycloakUrl: "https://keycloak.your-domain.com"
  keycloakClientId: "guardian-platform-frontend"
  keycloakRealm: "guardian"

  # Application Settings
  appTitle: "Guardian"
  displayTimezone: "UTC"

  # Feature Flags
  features:
    governance: true
    lineage: true
