# Auth0 Configuration Example
# Minimal configuration for deploying Guardian with Auth0
# For all available values, see the chart's values.yaml and README.md
#
# Usage:
#   Set these values under the `guardian:` key in your umbrella values file

image:
  tag: ""
  pullPolicy: Always

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
  hosts:
    - host: "guardian.your-domain.com"
      paths:
        - path: "/"
          pathType: "Prefix"
  tls:
    - secretName: "guardian-tls"
      hosts:
        - "guardian.your-domain.com"

config:
  # Auth0 Configuration
  auth0Domain: "your-tenant.us.auth0.com"
  auth0ClientId: "YOUR_AUTH0_SPA_CLIENT_ID"
  auth0Audience: "https://guardian.your-domain.com"

  # Application Settings
  appTitle: "Guardian"
  displayTimezone: "UTC"

  # Feature Flags
  features:
    governance: true
    lineage: true
