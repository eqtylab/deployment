{{- if .Values.dashboards.enabled }}
{{- if .Values.dashboards.platformOverview.enabled }}
{{- $uid := .Values.dashboards.platformOverview.uid | toString }}
{{- if not (regexMatch "^[A-Za-z0-9_-]{1,40}$" $uid) }}
{{- fail "dashboards.platformOverview.uid must be 1-40 letters, digits, '-', or '_'" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "governance-ops.targetRelease" . }}-guardian-platform-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "governance-ops.labels" . | nindent 4 }}
    grafana_dashboard: "1"
    {{- with .Values.dashboards.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.dashboards.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  guardian-platform.json: |-
{{ .Files.Get "dashboards/guardian-platform.json" | replace "\"guardian-platform\"" (include "governance-ops.targetRelease" . | quote) | replace "\"uid\": \"platform-overview\"" (printf "\"uid\": %s" ($uid | quote)) | replace "probe/monitoring/governance-ops-" (printf "probe/%s/%s-" .Release.Namespace (include "governance-ops.fullname" .)) | indent 4 }}
{{- end }}
{{- end }}
