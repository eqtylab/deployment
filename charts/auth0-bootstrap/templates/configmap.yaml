{{- if .Values.bootstrap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "auth0-bootstrap.fullname" . }}-scripts
  labels:
    {{- include "auth0-bootstrap.labels" . | nindent 4 }}
data:
  bootstrap.sh: |
    #!/bin/sh
    set -e

    # Colors for output
    RED=$(printf '\033[0;31m')
    GREEN=$(printf '\033[0;32m')
    YELLOW=$(printf '\033[1;33m')
    NC=$(printf '\033[0m') # No Color

    # Configuration from environment
    AUTH0_DOMAIN="${AUTH0_DOMAIN}"
    AUTH0_MGMT_CLIENT_ID="${AUTH0_MGMT_CLIENT_ID}"
    AUTH0_MGMT_CLIENT_SECRET="${AUTH0_MGMT_CLIENT_SECRET}"
    AUTH0_API_URL="https://${AUTH0_DOMAIN}/api/v2"
    AUTH0_AUDIENCE="https://${AUTH0_DOMAIN}/api/v2/"

    echo "Starting Auth0 bootstrap process..."
    echo "Auth0 Domain: ${AUTH0_DOMAIN}"

    # Function to get Management API token
    get_mgmt_token() {
      echo "Getting Management API token..."
      TOKEN_REQUEST=$(jq -n \
        --arg client_id "$AUTH0_MGMT_CLIENT_ID" \
        --arg client_secret "$AUTH0_MGMT_CLIENT_SECRET" \
        --arg audience "$AUTH0_AUDIENCE" \
        '{client_id: $client_id, client_secret: $client_secret, audience: $audience, grant_type: "client_credentials"}')
      TOKEN_RESPONSE=$(curl -s -X POST "https://${AUTH0_DOMAIN}/oauth/token" \
        -H "Content-Type: application/json" \
        -d "$TOKEN_REQUEST")

      TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.access_token')

      if [ "$TOKEN" = "null" ] || [ -z "$TOKEN" ]; then
        echo "${RED}Failed to get Management API token${NC}"
        echo "Response: $TOKEN_RESPONSE"
        return 1
      fi
      echo "${GREEN}Successfully obtained Management API token${NC}"
      return 0
    }

    # Function to read every page of a Management API list endpoint (echoes one JSON array)
    list_all() {
      local RESOURCE=$1
      local ALL='[]'
      local PAGE=0
      while :; do
        RESPONSE=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer ${TOKEN}" \
          "${AUTH0_API_URL}/${RESOURCE}&per_page=100&page=${PAGE}")
        HTTP_CODE=$(echo "$RESPONSE" | tail -1)
        BODY=$(echo "$RESPONSE" | sed '$d')
        if [ "$HTTP_CODE" != "200" ]; then
          echo "  ${RED}Failed to list ${RESOURCE%%\?*} (HTTP ${HTTP_CODE})${NC}" >&2
          echo "  Response: $BODY" >&2
          return 1
        fi
        ALL=$(jq -n -c --argjson all "$ALL" --argjson page "$BODY" '$all + $page')
        if [ "$(echo "$BODY" | jq 'length')" -lt 100 ]; then
          break
        fi
        PAGE=$((PAGE + 1))
      done
      echo "$ALL"
    }

    # Function to check if an application exists by name
    get_client_by_name() {
      local APP_NAME=$1
      local CLIENTS
      CLIENTS=$(list_all "clients?fields=client_id,name&include_fields=true") || return 1
      echo "$CLIENTS" | jq -r --arg name "$APP_NAME" '[.[] | select(.name == $name) | .client_id][0] // empty'
    }

    # Function to print the entries added to and removed from a JSON array
    log_list_change() {
      local FIELD=$1
      local OLD=$2
      local NEW=$3

      ADDED=$(jq -n -r --argjson old "$OLD" --argjson new "$NEW" '($new - $old) | join(", ")')
      REMOVED=$(jq -n -r --argjson old "$OLD" --argjson new "$NEW" '($old - $new) | join(", ")')
      if [ -n "$ADDED" ]; then
        echo "  ${FIELD}: added ${ADDED}"
      fi
      if [ -n "$REMOVED" ]; then
        echo "  ${FIELD}: removed ${REMOVED}"
      fi
      return 0
    }

    # Function to update an existing SPA application's URLs and grant types from the values
    update_spa_app() {
      local APP_CLIENT_ID=$1
      local CALLBACKS=$2
      local LOGOUT_URLS=$3
      local WEB_ORIGINS=$4

      CURRENT=$(curl -s -H "Authorization: Bearer ${TOKEN}" \
        "${AUTH0_API_URL}/clients/${APP_CLIENT_ID}?fields=callbacks,allowed_logout_urls,web_origins,grant_types&include_fields=true")
      if ! echo "$CURRENT" | jq -e 'type == "object" and (has("statusCode") | not)' > /dev/null 2>&1; then
        echo "  ${RED}Failed to read application ${APP_CLIENT_ID}${NC}"
        echo "  Response: $CURRENT"
        return 1
      fi

      DESIRED=$(jq -n -c \
        --argjson callbacks "$CALLBACKS" \
        --argjson logout "$LOGOUT_URLS" \
        --argjson origins "$WEB_ORIGINS" \
        '{callbacks: $callbacks, allowed_logout_urls: $logout, web_origins: $origins, grant_types: ["authorization_code", "refresh_token"]}')

      for FIELD in callbacks allowed_logout_urls web_origins grant_types; do
        log_list_change "$FIELD" "$(echo "$CURRENT" | jq -c ".${FIELD} // []")" "$(echo "$DESIRED" | jq -c ".${FIELD}")"
      done

      MATCHES=$(jq -n -r --argjson cur "$CURRENT" --argjson want "$DESIRED" \
        '[$want | to_entries[] | (.value | sort) == (($cur[.key] // []) | sort)] | all')
      if [ "$MATCHES" = "true" ]; then
        echo "  Application settings already match the values"
        return 0
      fi

      RESPONSE=$(curl -s -w "\n%{http_code}" -X PATCH "${AUTH0_API_URL}/clients/${APP_CLIENT_ID}" \
        -H "Authorization: Bearer ${TOKEN}" \
        -H "Content-Type: application/json" \
        -d "${DESIRED}")

      HTTP_CODE=$(echo "$RESPONSE" | tail -1)
      BODY=$(echo "$RESPONSE" | sed '$d')

      if [ "$HTTP_CODE" = "200" ]; then
        echo "  ${GREEN}Updated application from the values${NC}"
        return 0
      else
        echo "  ${RED}Failed to update application (HTTP ${HTTP_CODE})${NC}"
        echo "  Response: $BODY"
        return 1
      fi
    }

    # Function to create a SPA application
    create_spa_app() {
      local APP_NAME=$1
      local CALLBACKS=$2
      local LOGOUT_URLS=$3
      local WEB_ORIGINS=$4

      echo "Creating SPA application: ${APP_NAME}..."

      EXISTING=$(get_client_by_name "$APP_NAME") || return 1
      if [ -n "$EXISTING" ]; then
        echo "  Application already exists (client_id: ${EXISTING}); updating it from the values"
        update_spa_app "$EXISTING" "$CALLBACKS" "$LOGOUT_URLS" "$WEB_ORIGINS"
        return $?
      fi

      APP_CONFIG=$(jq -n \
        --arg name "$APP_NAME" \
        --argjson callbacks "$CALLBACKS" \
        --argjson logout "$LOGOUT_URLS" \
        --argjson origins "$WEB_ORIGINS" \
        '{name: $name, app_type: "spa", callbacks: $callbacks, allowed_logout_urls: $logout, web_origins: $origins,
          token_endpoint_auth_method: "none", oidc_conformant: true, grant_types: ["authorization_code", "refresh_token"]}')

      RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${AUTH0_API_URL}/clients" \
        -H "Authorization: Bearer ${TOKEN}" \
        -H "Content-Type: application/json" \
        -d "${APP_CONFIG}")

      HTTP_CODE=$(echo "$RESPONSE" | tail -1)
      BODY=$(echo "$RESPONSE" | sed '$d')

      if [ "$HTTP_CODE" = "201" ]; then
        CLIENT_ID=$(echo "$BODY" | jq -r '.client_id')
        echo "  ${GREEN}Created SPA application (client_id: ${CLIENT_ID})${NC}"
        return 0
      else
        echo "  ${RED}Failed to create SPA application (HTTP ${HTTP_CODE})${NC}"
        echo "  Response: $BODY"
        return 1
      fi
    }

    # Function to create an M2M application
    create_m2m_app() {
      local APP_NAME=$1

      echo "Creating M2M application: ${APP_NAME}..."

      EXISTING=$(get_client_by_name "$APP_NAME") || return 1
      if [ -n "$EXISTING" ]; then
        echo "  Application already exists (client_id: ${EXISTING})"
        return 0
      fi

      APP_CONFIG=$(jq -n --arg name "$APP_NAME" \
        '{name: $name, app_type: "non_interactive", token_endpoint_auth_method: "client_secret_post",
          oidc_conformant: true, grant_types: ["client_credentials"]}')

      RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${AUTH0_API_URL}/clients" \
        -H "Authorization: Bearer ${TOKEN}" \
        -H "Content-Type: application/json" \
        -d "${APP_CONFIG}")

      HTTP_CODE=$(echo "$RESPONSE" | tail -1)
      BODY=$(echo "$RESPONSE" | sed '$d')

      if [ "$HTTP_CODE" = "201" ]; then
        CLIENT_ID=$(echo "$BODY" | jq -r '.client_id')
        CLIENT_SECRET=$(echo "$BODY" | jq -r '.client_secret')
        echo "  ${GREEN}Created M2M application (client_id: ${CLIENT_ID})${NC}"
        echo "  ${YELLOW}Client Secret: ${CLIENT_SECRET}${NC}"
        echo "  Save this secret — you will need it for Kubernetes secrets."
        return 0
      else
        echo "  ${RED}Failed to create M2M application (HTTP ${HTTP_CODE})${NC}"
        echo "  Response: $BODY"
        return 1
      fi
    }

    # Function to check if an API exists by identifier
    get_api_by_identifier() {
      local IDENTIFIER=$1
      local APIS
      APIS=$(list_all "resource-servers?include_totals=false") || return 1
      echo "$APIS" | jq -r --arg id "$IDENTIFIER" '[.[] | select(.identifier == $id) | .id][0] // empty'
    }

    # Function to create an API (resource server) with permissions
    create_api() {
      local API_NAME=$1
      local API_IDENTIFIER=$2
      local PERMISSIONS=$3

      echo "Creating API: ${API_NAME} (${API_IDENTIFIER})..."

      EXISTING=$(get_api_by_identifier "$API_IDENTIFIER") || return 1
      if [ -n "$EXISTING" ]; then
        echo "  API already exists (id: ${EXISTING})"

        # Update permissions on existing API
        echo "  Updating permissions..."
        RESPONSE=$(curl -s -w "\n%{http_code}" -X PATCH "${AUTH0_API_URL}/resource-servers/${EXISTING}" \
          -H "Authorization: Bearer ${TOKEN}" \
          -H "Content-Type: application/json" \
          -d "$(jq -n -c --argjson scopes "$PERMISSIONS" '{scopes: $scopes}')")

        HTTP_CODE=$(echo "$RESPONSE" | tail -1)
        if [ "$HTTP_CODE" = "200" ]; then
          echo "  ${GREEN}Permissions updated${NC}"
        else
          echo "  ${RED}Failed to update permissions (HTTP ${HTTP_CODE})${NC}"
          return 1
        fi
        return 0
      fi

      API_CONFIG=$(jq -n \
        --arg name "$API_NAME" \
        --arg identifier "$API_IDENTIFIER" \
        --argjson lifetime {{ .Values.auth0.api.tokenLifetime | int }} \
        --argjson offline {{ .Values.auth0.api.allowOfflineAccess | toJson }} \
        --argjson scopes "$PERMISSIONS" \
        '{name: $name, identifier: $identifier, signing_alg: "RS256", token_lifetime: $lifetime,
          allow_offline_access: $offline, scopes: $scopes}')

      RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${AUTH0_API_URL}/resource-servers" \
        -H "Authorization: Bearer ${TOKEN}" \
        -H "Content-Type: application/json" \
        -d "${API_CONFIG}")

      HTTP_CODE=$(echo "$RESPONSE" | tail -1)
      BODY=$(echo "$RESPONSE" | sed '$d')

      if [ "$HTTP_CODE" = "201" ]; then
        API_ID=$(echo "$BODY" | jq -r '.id')
        echo "  ${GREEN}Created API (id: ${API_ID})${NC}"
        return 0
      else
        echo "  ${RED}Failed to create API (HTTP ${HTTP_CODE})${NC}"
        echo "  Response: $BODY"
        return 1
      fi
    }

    # Function to grant an M2M client access to an API
    grant_client_api_access() {
      local CLIENT_NAME=$1
      local API_IDENTIFIER=$2
      local SCOPES=$3

      echo "Granting '${CLIENT_NAME}' access to API '${API_IDENTIFIER}'..."

      CLIENT_ID=$(get_client_by_name "$CLIENT_NAME") || return 1
      if [ -z "$CLIENT_ID" ]; then
        echo "  ${RED}Client ${CLIENT_NAME} not found${NC}"
        return 1
      fi

      # Check if grant already exists
      local GRANTS
      GRANTS=$(list_all "client-grants?client_id=${CLIENT_ID}&audience=$(printf '%s' "$API_IDENTIFIER" | jq -Rr @uri)") || return 1
      EXISTING_GRANT=$(echo "$GRANTS" | jq -r '.[0].id // empty')

      if [ -n "$EXISTING_GRANT" ]; then
        echo "  Grant already exists, updating scopes..."
        RESPONSE=$(curl -s -w "\n%{http_code}" -X PATCH "${AUTH0_API_URL}/client-grants/${EXISTING_GRANT}" \
          -H "Authorization: Bearer ${TOKEN}" \
          -H "Content-Type: application/json" \
          -d "$(jq -n -c --argjson scope "$SCOPES" '{scope: $scope}')")

        HTTP_CODE=$(echo "$RESPONSE" | tail -1)
        if [ "$HTTP_CODE" = "200" ]; then
          echo "  ${GREEN}Grant updated${NC}"
        else
          echo "  ${RED}Failed to update grant (HTTP ${HTTP_CODE})${NC}"
          return 1
        fi
        return 0
      fi

      GRANT_CONFIG=$(jq -n \
        --arg client_id "$CLIENT_ID" \
        --arg audience "$API_IDENTIFIER" \
        --argjson scope "$SCOPES" \
        '{client_id: $client_id, audience: $audience, scope: $scope}')

      RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${AUTH0_API_URL}/client-grants" \
        -H "Authorization: Bearer ${TOKEN}" \
        -H "Content-Type: application/json" \
        -d "${GRANT_CONFIG}")

      HTTP_CODE=$(echo "$RESPONSE" | tail -1)
      BODY=$(echo "$RESPONSE" | sed '$d')

      if [ "$HTTP_CODE" = "201" ]; then
        echo "  ${GREEN}Grant created${NC}"
        return 0
      else
        echo "  ${RED}Failed to create grant (HTTP ${HTTP_CODE})${NC}"
        echo "  Response: $BODY"
        return 1
      fi
    }

    # Function to grant an M2M client access to the Management API
    grant_mgmt_api_access() {
      local CLIENT_NAME=$1
      local SCOPES=$2

      grant_client_api_access "$CLIENT_NAME" "${AUTH0_AUDIENCE}" "$SCOPES"
    }

    # Function to look up an action by name (echoes action ID or empty)
    get_action_by_name() {
      local ACTION_NAME=$1
      local RESPONSE
      RESPONSE=$(curl -s -G -w "\n%{http_code}" \
        --data-urlencode "actionName=${ACTION_NAME}" \
        -H "Authorization: Bearer ${TOKEN}" \
        "${AUTH0_API_URL}/actions/actions")
      local BODY
      BODY=$(echo "$RESPONSE" | sed '$d')
      if [ "$(echo "$RESPONSE" | tail -1)" != "200" ]; then
        echo "  ${RED}Failed to look up action ${ACTION_NAME} (HTTP $(echo "$RESPONSE" | tail -1))${NC}" >&2
        echo "  Response: $BODY" >&2
        return 1
      fi
      echo "$BODY" | jq -r --arg name "$ACTION_NAME" '[.actions[]? | select(.name == $name) | .id][0] // empty'
    }

    # Function to wait until an action's latest version is built (Auth0 builds asynchronously)
    wait_for_action_build() {
      local ACTION_ID=$1
      local STATUS=""
      local ATTEMPT=0
      while [ "$ATTEMPT" -lt 30 ]; do
        STATUS=$(curl -s -H "Authorization: Bearer ${TOKEN}" \
          "${AUTH0_API_URL}/actions/actions/${ACTION_ID}" | jq -r '.status // empty')
        case "$STATUS" in
          built)
            return 0
            ;;
          failed)
            echo "  ${RED}Action build failed${NC}" >&2
            return 1
            ;;
        esac
        ATTEMPT=$((ATTEMPT + 1))
        sleep 2
      done
      echo "  ${RED}Action not built after 60s (status: ${STATUS:-unknown})${NC}" >&2
      return 1
    }

    # Function to create or update an action and deploy it (echoes action ID)
    create_or_update_action() {
      local ACTION_NAME=$1
      local CODE_FILE=$2
      local TRIGGER_ID=$3
      local TRIGGER_VERSION=$4
      local RUNTIME=$5
      local DEPENDENCIES_JSON=$6
      local SECRETS_JSON=$7

      if [ ! -f "$CODE_FILE" ]; then
        echo "  ${RED}Action code file not found: ${CODE_FILE}${NC}" >&2
        return 1
      fi

      local CODE_JSON
      CODE_JSON=$(jq -Rs '.' < "$CODE_FILE")

      local TRIGGER_JSON
      TRIGGER_JSON=$(jq -n \
        --arg id "$TRIGGER_ID" \
        --arg ver "$TRIGGER_VERSION" \
        '[{id: $id, version: $ver}]')

      local PAYLOAD
      PAYLOAD=$(jq -n \
        --arg name "$ACTION_NAME" \
        --argjson code "$CODE_JSON" \
        --arg runtime "$RUNTIME" \
        --argjson deps "$DEPENDENCIES_JSON" \
        --argjson secrets "$SECRETS_JSON" \
        --argjson triggers "$TRIGGER_JSON" \
        '{name: $name, code: $code, runtime: $runtime, dependencies: $deps, secrets: $secrets, supported_triggers: $triggers}')

      local EXISTING
      EXISTING=$(get_action_by_name "$ACTION_NAME") || return 1

      local ACTION_ID=""
      if [ -n "$EXISTING" ]; then
        echo "Updating action '${ACTION_NAME}' (id: ${EXISTING})..." >&2
        local RESPONSE
        RESPONSE=$(curl -s -w "\n%{http_code}" -X PATCH \
          "${AUTH0_API_URL}/actions/actions/${EXISTING}" \
          -H "Authorization: Bearer ${TOKEN}" \
          -H "Content-Type: application/json" \
          -d "$PAYLOAD")
        local HTTP_CODE
        HTTP_CODE=$(echo "$RESPONSE" | tail -1)
        local BODY
        BODY=$(echo "$RESPONSE" | sed '$d')
        if [ "$HTTP_CODE" = "200" ]; then
          echo "  ${GREEN}Action updated${NC}" >&2
          ACTION_ID="$EXISTING"
        else
          echo "  ${RED}Failed to update action (HTTP ${HTTP_CODE})${NC}" >&2
          echo "  Response: $BODY" >&2
          return 1
        fi
      else
        echo "Creating action '${ACTION_NAME}'..." >&2
        local RESPONSE
        RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
          "${AUTH0_API_URL}/actions/actions" \
          -H "Authorization: Bearer ${TOKEN}" \
          -H "Content-Type: application/json" \
          -d "$PAYLOAD")
        local HTTP_CODE
        HTTP_CODE=$(echo "$RESPONSE" | tail -1)
        local BODY
        BODY=$(echo "$RESPONSE" | sed '$d')
        if [ "$HTTP_CODE" = "201" ]; then
          ACTION_ID=$(echo "$BODY" | jq -r '.id')
          echo "  ${GREEN}Created action (id: ${ACTION_ID})${NC}" >&2
        else
          echo "  ${RED}Failed to create action (HTTP ${HTTP_CODE})${NC}" >&2
          echo "  Response: $BODY" >&2
          return 1
        fi
      fi

      # Deploy the action so its latest code becomes the active version
      echo "Waiting for action ${ACTION_ID} to build..." >&2
      wait_for_action_build "$ACTION_ID" || return 1
      echo "Deploying action ${ACTION_ID}..." >&2
      local DEPLOY_RESPONSE
      DEPLOY_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
        "${AUTH0_API_URL}/actions/actions/${ACTION_ID}/deploy" \
        -H "Authorization: Bearer ${TOKEN}")
      local DEPLOY_HTTP
      DEPLOY_HTTP=$(echo "$DEPLOY_RESPONSE" | tail -1)
      if [ "$DEPLOY_HTTP" = "200" ]; then
        echo "  ${GREEN}Action deployed${NC}" >&2
      else
        echo "  ${RED}Failed to deploy action (HTTP ${DEPLOY_HTTP})${NC}" >&2
        echo "  Response: $(echo "$DEPLOY_RESPONSE" | sed '$d')" >&2
        return 1
      fi

      echo "$ACTION_ID"
    }

    # Function to bind an action to a trigger, preserving existing bindings
    bind_action_to_trigger() {
      local TRIGGER_ID=$1
      local ACTION_ID=$2
      local DISPLAY_NAME=$3

      echo "Binding action ${ACTION_ID} to trigger '${TRIGGER_ID}'..." >&2

      # Stop if the current bindings can't be read; the PATCH below replaces them all
      local CURRENT_RESPONSE
      CURRENT_RESPONSE=$(curl -s -w "\n%{http_code}" \
        -H "Authorization: Bearer ${TOKEN}" \
        "${AUTH0_API_URL}/actions/triggers/${TRIGGER_ID}/bindings")
      local CURRENT_HTTP
      CURRENT_HTTP=$(echo "$CURRENT_RESPONSE" | tail -1)
      local CURRENT
      CURRENT=$(echo "$CURRENT_RESPONSE" | sed '$d')
      if [ "$CURRENT_HTTP" != "200" ]; then
        echo "  ${RED}Failed to read bindings for trigger '${TRIGGER_ID}' (HTTP ${CURRENT_HTTP})${NC}" >&2
        echo "  Response: $CURRENT" >&2
        return 1
      fi

      # Reshape existing bindings to the {ref, display_name} form PATCH expects
      local EXISTING_BINDINGS
      EXISTING_BINDINGS=$(echo "$CURRENT" | jq -c '
        [ .bindings[]? | {
            ref: { type: "action_id", value: .action.id },
            display_name: (.display_name // .action.name)
          } ]')

      local ALREADY
      ALREADY=$(echo "$EXISTING_BINDINGS" | jq --arg id "$ACTION_ID" \
        '[ .[] | select(.ref.value == $id) ] | length')

      local NEW_BINDINGS
      if [ "$ALREADY" -gt 0 ]; then
        echo "  Binding already exists, leaving order unchanged" >&2
        NEW_BINDINGS="$EXISTING_BINDINGS"
      else
        NEW_BINDINGS=$(echo "$EXISTING_BINDINGS" | jq \
          --arg id "$ACTION_ID" \
          --arg name "$DISPLAY_NAME" \
          '. + [{ ref: { type: "action_id", value: $id }, display_name: $name }]')
      fi

      local PAYLOAD
      PAYLOAD=$(jq -n --argjson bindings "$NEW_BINDINGS" '{bindings: $bindings}')

      local RESPONSE
      RESPONSE=$(curl -s -w "\n%{http_code}" -X PATCH \
        "${AUTH0_API_URL}/actions/triggers/${TRIGGER_ID}/bindings" \
        -H "Authorization: Bearer ${TOKEN}" \
        -H "Content-Type: application/json" \
        -d "$PAYLOAD")
      local HTTP_CODE
      HTTP_CODE=$(echo "$RESPONSE" | tail -1)
      local BODY
      BODY=$(echo "$RESPONSE" | sed '$d')

      if [ "$HTTP_CODE" = "200" ]; then
        echo "  ${GREEN}Binding updated${NC}" >&2
        return 0
      else
        echo "  ${RED}Failed to bind action (HTTP ${HTTP_CODE})${NC}" >&2
        echo "  Response: $BODY" >&2
        return 1
      fi
    }

    # Function to create a user
    create_user() {
      local EMAIL=$1
      local PASSWORD=$2
      local FIRST_NAME=$3
      local LAST_NAME=$4
      local CONNECTION=$5

      echo "Creating user: ${EMAIL}..."

      # Check if user exists
      EXISTING=$(curl -s -H "Authorization: Bearer ${TOKEN}" \
        "${AUTH0_API_URL}/users-by-email?email=$(echo "$EMAIL" | jq -Rr @uri)" \
        | jq -r '.[0].user_id // empty')

      if [ -n "$EXISTING" ]; then
        echo "  User already exists (user_id: ${EXISTING})"
        return 0
      fi

      USER_CONFIG=$(jq -n \
        --arg email "$EMAIL" \
        --arg password "$PASSWORD" \
        --arg first "$FIRST_NAME" \
        --arg last "$LAST_NAME" \
        --arg connection "$CONNECTION" \
        '{email: $email, password: $password, given_name: $first, family_name: $last,
          name: "\($first) \($last)", connection: $connection, email_verified: true}')

      RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${AUTH0_API_URL}/users" \
        -H "Authorization: Bearer ${TOKEN}" \
        -H "Content-Type: application/json" \
        -d "${USER_CONFIG}")

      HTTP_CODE=$(echo "$RESPONSE" | tail -1)
      BODY=$(echo "$RESPONSE" | sed '$d')

      if [ "$HTTP_CODE" = "201" ]; then
        USER_ID=$(echo "$BODY" | jq -r '.user_id')
        echo "  ${GREEN}User created (user_id: ${USER_ID})${NC}"
        return 0
      elif [ "$HTTP_CODE" = "409" ]; then
        echo "  User already exists"
        return 0
      else
        echo "  ${RED}Failed to create user (HTTP ${HTTP_CODE})${NC}"
        echo "  Response: $BODY"
        return 1
      fi
    }

    # Main bootstrap process
    main() {
      # Get Management API token
      if ! get_mgmt_token; then
        echo "Failed to authenticate with Auth0 Management API"
        exit 1
      fi

      # Build permissions JSON array
      PERMISSIONS=$(jq -c '[.[] | {value: .name, description: .description}]' <<'EOF'
    {{ .Values.scopes | toJson }}
    EOF
    )

      # Create API with permissions
      create_api \
        "{{ .Values.auth0.api.name }}" \
        "{{ .Values.auth0.api.identifier }}" \
        "$PERMISSIONS"

      # Create frontend SPA application
      {{- with .Values.applications.frontend }}
      create_spa_app \
        "{{ .name }}" \
        '{{ .callbacks | toJson }}' \
        '{{ .logoutUrls | toJson }}' \
        '{{ .webOrigins | toJson }}'
      {{- end }}

      # Create backend M2M application
      {{- with .Values.applications.backend }}
      create_m2m_app "{{ .name }}"
      {{- end }}

      # Create worker M2M application
      {{- with .Values.applications.worker }}
      create_m2m_app "{{ .name }}"
      {{- end }}

      # Grant backend M2M app access to the governance API
      {{- with .Values.applications.backend }}
      {{- if .apiScopes }}
      grant_client_api_access \
        "{{ .name }}" \
        "{{ $.Values.auth0.api.identifier }}" \
        '{{ .apiScopes | toJson }}'
      {{- end }}
      {{- end }}

      # Grant backend M2M app access to the Management API (for user management)
      {{- with .Values.applications.backend }}
      {{- if .managementApiScopes }}
      grant_mgmt_api_access \
        "{{ .name }}" \
        '{{ .managementApiScopes | toJson }}'
      {{- end }}
      {{- end }}

      # Grant worker M2M app access to the governance API
      {{- with .Values.applications.worker }}
      {{- if .apiScopes }}
      grant_client_api_access \
        "{{ .name }}" \
        "{{ $.Values.auth0.api.identifier }}" \
        '{{ .apiScopes | toJson }}'
      {{- end }}
      {{- end }}

      # Create admin user
      {{- if .Values.users.admin.enabled }}
      ADMIN_PASSWORD="${ADMIN_USER_PASSWORD}"
      create_user \
        "{{ .Values.users.admin.email }}" \
        "${ADMIN_PASSWORD}" \
        "{{ .Values.users.admin.firstName }}" \
        "{{ .Values.users.admin.lastName }}" \
        "{{ .Values.users.admin.connection }}"
      {{- end }}

      # Create test users
      {{- if .Values.users.testUsers.enabled }}
      {{- range .Values.users.testUsers.users }}
      create_user \
        "{{ .email }}" \
        "{{ .password }}" \
        "{{ .firstName }}" \
        "{{ .lastName }}" \
        "{{ $.Values.users.admin.connection }}"
      {{- end }}
      {{- end }}

      # Create / update / deploy / bind Auth0 Actions
      {{- if .Values.actions.enabled }}
      echo ""
      echo "Configuring Auth0 Actions..."

      {{- if .Values.actions.postLogin.enabled }}
      {{- with .Values.actions.postLogin }}
      echo ""
      PL_SECRETS=$(jq -n \
        --arg url_dev   "{{ .authService.urlDev }}" \
        --arg url_stag  "{{ .authService.urlStaging }}" \
        --arg url_prod  "{{ .authService.urlProduction }}" \
        --arg url       "{{ .authService.url }}" \
        --arg api_secret "${AUTH0_AUTH_SERVICE_API_SECRET:-}" \
        '[
           {name: "AUTH_SERVICE_URL_DEV",        value: $url_dev},
           {name: "AUTH_SERVICE_URL_STAGING",    value: $url_stag},
           {name: "AUTH_SERVICE_URL_PRODUCTION", value: $url_prod},
           {name: "AUTH_SERVICE_URL",            value: $url},
           {name: "AUTH_SERVICE_API_SECRET",     value: $api_secret}
         ] | map(select(.value != ""))')

      PL_ID=$(create_or_update_action \
        "{{ .name }}" \
        "/actions/{{ .codeFile }}" \
        "{{ .trigger.id }}" \
        "{{ .trigger.version }}" \
        "{{ .runtime }}" \
        '{{ .dependencies | toJson }}' \
        "$PL_SECRETS")
      if [ -n "$PL_ID" ]; then
        bind_action_to_trigger "{{ .trigger.id }}" "$PL_ID" "{{ .name }}"
      fi
      {{- end }}
      {{- end }}

      {{- if .Values.actions.clientCredentialsExchange.enabled }}
      {{- with .Values.actions.clientCredentialsExchange }}
      echo ""
      CCE_SECRETS=$(jq -n \
        --arg domain        "{{ $.Values.auth0.domain }}" \
        --arg client_id     "${AUTH0_MGMT_CLIENT_ID}" \
        --arg client_secret "${AUTH0_MGMT_CLIENT_SECRET}" \
        '[
           {name: "domain",       value: $domain},
           {name: "clientId",     value: $client_id},
           {name: "clientSecret", value: $client_secret}
         ] | map(select(.value != ""))')

      CCE_ID=$(create_or_update_action \
        "{{ .name }}" \
        "/actions/{{ .codeFile }}" \
        "{{ .trigger.id }}" \
        "{{ .trigger.version }}" \
        "{{ .runtime }}" \
        '{{ .dependencies | toJson }}' \
        "$CCE_SECRETS")
      if [ -n "$CCE_ID" ]; then
        bind_action_to_trigger "{{ .trigger.id }}" "$CCE_ID" "{{ .name }}"
      fi
      {{- end }}
      {{- end }}
      {{- end }}

      echo ""
      echo "${GREEN}Auth0 bootstrap completed successfully!${NC}"
      echo ""
      echo "Next steps:"
      echo "  1. Retrieve the client IDs and secrets from the output above"
      echo "  2. Create Kubernetes secrets with: kubectl create secret generic platform-auth0 ..."
      echo "  3. Deploy the guardian-platform chart"
    }

    # Run main function
    main
{{- end }}
