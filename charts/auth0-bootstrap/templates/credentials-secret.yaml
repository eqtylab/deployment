{{- if .Values.bootstrap.enabled }}
# Created empty; the bootstrap job patches in new client IDs and secrets
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "auth0-bootstrap.credentialsSecretName" . }}
  labels:
    {{- include "auth0-bootstrap.labels" . | nindent 4 }}
    app.kubernetes.io/component: credentials
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
{{- end }}
