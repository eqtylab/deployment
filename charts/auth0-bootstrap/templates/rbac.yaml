{{- if .Values.bootstrap.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "auth0-bootstrap.fullname" . }}
  labels:
    {{- include "auth0-bootstrap.labels" . | nindent 4 }}
    app.kubernetes.io/component: bootstrap
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "auth0-bootstrap.fullname" . }}
  labels:
    {{- include "auth0-bootstrap.labels" . | nindent 4 }}
    app.kubernetes.io/component: bootstrap
rules:
  # Helm creates the credentials Secret; the job only reads and patches it
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ include "auth0-bootstrap.credentialsSecretName" . | quote }}]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "auth0-bootstrap.fullname" . }}
  labels:
    {{- include "auth0-bootstrap.labels" . | nindent 4 }}
    app.kubernetes.io/component: bootstrap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "auth0-bootstrap.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "auth0-bootstrap.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
