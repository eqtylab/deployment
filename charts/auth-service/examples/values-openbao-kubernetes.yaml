# OpenBao Transit with Kubernetes workload authentication.
#
# Prerequisites (operator-managed, outside this chart):
#   - An OpenBao endpoint reachable at config.keyManagement.openbao.address with a
#     dedicated Transit mount for Auth and the scoped policy from the Auth README.
#   - A Kubernetes auth mount and a role bound to this release's service account,
#     namespace and audience, with a TokenReview reviewer configured on OpenBao.
# Requires an auth-service image that includes eqtylab/guardian#271 (the first release after 1.2.0 ships it).
# Set config.server.environment as for any other deployment.
config:
  keyManagement:
    provider: openbao
    openbao:
      # Bundled custody chart address. The bundled openbao-custody chart is an optional integration not yet approved for production rollout: for production, point Auth at a customer-operated OpenBao that meets your availability and recovery requirements, or qualify the bundled chart first.
      address: https://openbao-custody-active.custody.svc.cluster.local:8200
      transitMount: guardian-did
      keyPrefix: guardian
      ca:
        configMapName: openbao-ca
        key: ca.pem
      auth:
        method: kubernetes
        mount: kubernetes
        role: guardian-auth
        audience: openbao
