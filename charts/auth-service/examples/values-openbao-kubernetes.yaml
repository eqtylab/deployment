# OpenBao Transit with Kubernetes workload authentication (development profile).
#
# Prerequisites (operator-managed, outside this chart):
#   - An OpenBao endpoint reachable at config.keyManagement.openbao.address with a
#     dedicated Transit mount for Auth and the scoped policy from the Auth README.
#   - A Kubernetes auth mount and a role bound to this release's service account,
#     namespace and audience, with a TokenReview reviewer configured on OpenBao.
#   - An auth-service image containing the OpenBao provider and Kubernetes auth
#     (guardian PRs #216, #225, #223, #224). Current images only allow the
#     development profile, so the environment must resolve to "development".
config:
  server:
    environment: development
  keyManagement:
    provider: openbao
    openbao:
      developmentEnabled: true
      address: https://openbao-custody-active.custody.svc.cluster.local:8200
      transitMount: guardian-did
      keyPrefix: guardian
      ca:
        configMapName: openbao-ca
        key: ca.pem
      auth:
        method: kubernetes
        mount: kubernetes
        role: guardian-auth
        audience: openbao
