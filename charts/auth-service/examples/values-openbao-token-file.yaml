# OpenBao Transit with an operator-managed scoped token (development profile).
#
# This example targets an external, operator-managed OpenBao endpoint.
# For the supplied custody chart use https://openbao-custody-active.custody.svc.cluster.local:8200.
# The token lives in a Secret this chart never creates, for example written by
# an OpenBao Agent or a bootstrap procedure:
#   kubectl create secret generic platform-openbao-token \
#     --from-file=token=./auth.token --namespace governance
# Replacing the Secret's content rotates the credential without restarting Auth.
config:
  server:
    environment: development
  keyManagement:
    provider: openbao
    openbao:
      developmentEnabled: true
      address: https://openbao.custody.example.internal:8200
      ca:
        secretName: openbao-ca
        key: ca.pem
      auth:
        method: token_file
        tokenKey: token

secrets:
  keyManagement:
    openbao:
      name: platform-openbao-token
