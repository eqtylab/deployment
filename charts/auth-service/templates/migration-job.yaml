{{- if and .Values.enabled .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "auth-service.fullname" . }}-migration
  labels:
    {{- include "auth-service.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.migration.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "auth-service.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      {{- if (((.Values.global).secrets).imageRegistry).secretName }}
      imagePullSecrets:
        - name: {{ ((.Values.global).secrets).imageRegistry.secretName }}
      {{- else if (.Values.global).imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- else if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "auth-service.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default ((.Values.global).imagePullPolicy | default "IfNotPresent") }}
          command: ["/migrate"]
          {{- if or .Values.extraEnvVarsSecret .Values.extraEnvVarsConfigMap }}
          envFrom:
            {{- if .Values.extraEnvVarsSecret }}
            - secretRef:
                name: {{ .Values.extraEnvVarsSecret }}
            {{- end }}
            {{- if .Values.extraEnvVarsConfigMap }}
            - configMapRef:
                name: {{ .Values.extraEnvVarsConfigMap }}
            {{- end }}
          {{- end }}
          env:
            {{- $config := include (print $.Template.BasePath "/configmap.yaml") . | fromYaml }}
            {{- range $name, $value := $config.data }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            - name: DB_PASSWORD
              {{- if .Values.externalDatabase.password }}
              value: {{ .Values.externalDatabase.password | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalDatabase.passwordSecretKeyRef.name | default (((.Values.global).secrets).database).secretName | required "externalDatabase.passwordSecretKeyRef.name (or global.secrets.database.secretName) is required when externalDatabase.password is empty" | quote }}
                  key: {{ .Values.externalDatabase.passwordSecretKeyRef.key | default ((((.Values.global).secrets).database).keys).password | default "password" | quote }}
              {{- end }}
            {{- $pgSslRootCert := (((.Values.global).postgresql).sslRootCert) | default dict }}
            {{- if or $pgSslRootCert.secretName $pgSslRootCert.configMapName }}
            - name: PGSSLROOTCERT
              value: {{ printf "/etc/ssl/postgres/%s" ($pgSslRootCert.key | default "ca.crt") | quote }}
            {{- end }}
            {{- $idpProvider := include "auth-service.idpProvider" . }}
            {{- if eq $idpProvider "entra" }}
            - name: IDP_CLIENT_ID
              {{- if .Values.config.idp.entra.clientId }}
              value: {{ .Values.config.idp.entra.clientId | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.auth.entra.name | default ((((.Values.global).secrets).auth).entra).secretName | required "secrets.auth.entra.name (or global.secrets.auth.entra.secretName) is required when an Entra credential is not set inline" | quote }}
                  key: {{ (((((.Values.global).secrets).auth).entra).keys).clientId | default "client-id" | quote }}
              {{- end }}
            {{- else if ne $idpProvider "keycloak" }}
            - name: IDP_CLIENT_ID
              {{- if .Values.config.idp.auth0.clientId }}
              value: {{ .Values.config.idp.auth0.clientId | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.auth.auth0.name | default ((((.Values.global).secrets).auth).auth0).secretName | required "secrets.auth.auth0.name (or global.secrets.auth.auth0.secretName) is required when an Auth0 credential is not set inline" | quote }}
                  key: {{ (((((.Values.global).secrets).auth).auth0).keys).clientId | default "client-id" | quote }}
              {{- end }}
            {{- end }}
            - name: API_SECRET
              {{- if .Values.config.apiSecret }}
              value: {{ .Values.config.apiSecret | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.authService.name | default (((.Values.global).secrets).authService).secretName | required "secrets.authService.name (or global.secrets.authService.secretName) is required when config.apiSecret or config.jwtSecret is empty" | quote }}
                  key: {{ ((((.Values.global).secrets).authService).keys).apiSecret | default "api-secret" | quote }}
              {{- end }}
          {{- with .Values.migration.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or $pgSslRootCert.secretName $pgSslRootCert.configMapName }}
          volumeMounts:
            - name: postgres-ca
              mountPath: /etc/ssl/postgres
              readOnly: true
          {{- end }}
      {{- if $pgSslRootCert.secretName }}
      volumes:
        - name: postgres-ca
          secret:
            secretName: {{ $pgSslRootCert.secretName | quote }}
            items:
              - key: {{ $pgSslRootCert.key | default "ca.crt" | quote }}
                path: {{ $pgSslRootCert.key | default "ca.crt" | quote }}
      {{- else if $pgSslRootCert.configMapName }}
      volumes:
        - name: postgres-ca
          configMap:
            name: {{ $pgSslRootCert.configMapName | quote }}
            items:
              - key: {{ $pgSslRootCert.key | default "ca.crt" | quote }}
                path: {{ $pgSslRootCert.key | default "ca.crt" | quote }}
      {{- end }}
{{- end }}
