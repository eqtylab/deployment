{{- if and .Values.enabled .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "auth-service.fullname" . }}
  labels:
    {{- include "auth-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "auth-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  {{- with .Values.networkPolicy.ingress }}
  ingress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- $bao := .Values.config.keyManagement.openbao }}
  {{- $openbaoEgress := and (eq (include "auth-service.keyManagementProvider" .) "openbao") $bao.networkPolicy.to }}
  {{- if or .Values.networkPolicy.egress $openbaoEgress }}
  egress:
    {{- with .Values.networkPolicy.egress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if $openbaoEgress }}
    # OpenBao Transit endpoint (config.keyManagement.openbao.networkPolicy)
    - to:
        {{- toYaml $bao.networkPolicy.to | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ $bao.networkPolicy.port | default 8200 }}
    {{- end }}
  {{- end }}
{{- end }}
