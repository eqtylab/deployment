{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "auth-service.fullname" . }}
  labels:
    {{- include "auth-service.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "auth-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "auth-service.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if and .Values.global (((.Values.global).secrets).imageRegistry).secretName }}
      imagePullSecrets:
        - name: {{ ((.Values.global).secrets).imageRegistry.secretName }}
      {{- else if (.Values.global).imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- else if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- if or .Values.serviceAccount.create .Values.serviceAccount.name }}
      serviceAccountName: {{ .Values.serviceAccount.name | default (include "auth-service.fullname" .) }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-deps
          image: {{ (((.Values.global).utilityImages).busybox | default "busybox:1.36") | quote }}
          imagePullPolicy: {{ (.Values.global).imagePullPolicy | default "IfNotPresent" }}
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          command:
            - sh
            - -ec
            - |
              echo "Waiting 5s for PostgreSQL to start..."
              sleep 5
              echo "Checking for Postgres at $DB_HOST:$DB_PORT..."
              until nc -z -w 2 "$DB_HOST" "$DB_PORT"; do
                echo "Postgres not ready yet..."
                sleep 2
              done
              echo "Postgres is ready!"
              {{- if .Values.waitDeps.governanceService.enabled }}

              echo "Checking for Governance Service at $GOV_SERVICE_HOST:$GOV_SERVICE_PORT..."
              until nc -z -w 2 "$GOV_SERVICE_HOST" "$GOV_SERVICE_PORT"; do
                echo "Governance Service not ready yet..."
                sleep 2
              done
              echo "Governance Service is ready!"
              {{- end }}
          env:
            - name: DB_HOST
              value: {{ .Values.externalDatabase.host | default ((.Values.global).postgresql).host | default (printf "%s-postgresql" .Release.Name) | quote }}
            - name: DB_PORT
              value: {{ .Values.externalDatabase.port | default ((.Values.global).postgresql).port | default "5432" | quote }}
            {{- with .Values.waitDeps.governanceService }}
            {{- if .enabled }}
            - name: GOV_SERVICE_HOST
              value: {{ .host | default (printf "%s-governance-service" $.Release.Name) | quote }}
            - name: GOV_SERVICE_PORT
              value: {{ .port | default 10001 | toString | quote }}
            {{- end }}
            {{- end }}
        {{- with .Values.initContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "auth-service.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default ((.Values.global).imagePullPolicy | default "IfNotPresent") }}
          ports:
            - name: http
              containerPort: {{ .Values.config.server.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "auth-service.fullname" . }}
            {{- if .Values.extraEnvVarsSecret }}
            - secretRef:
                name: {{ .Values.extraEnvVarsSecret }}
            {{- end }}
            {{- if .Values.extraEnvVarsConfigMap }}
            - configMapRef:
                name: {{ .Values.extraEnvVarsConfigMap }}
            {{- end }}
          env:
            # ========================================================================
            # Database Configuration
            # ========================================================================
            - name: DB_PASSWORD
              {{- if .Values.externalDatabase.password }}
              value: {{ .Values.externalDatabase.password | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalDatabase.passwordSecretKeyRef.name | default (((.Values.global).secrets).database).secretName | required "externalDatabase.passwordSecretKeyRef.name (or global.secrets.database.secretName) is required when externalDatabase.password is empty" | quote }}
                  key: {{ .Values.externalDatabase.passwordSecretKeyRef.key | default ((((.Values.global).secrets).database).keys).password | default "password" | quote }}
              {{- end }}
            {{- $pgSslRootCert := (((.Values.global).postgresql).sslRootCert) | default dict }}
            {{- if or $pgSslRootCert.secretName $pgSslRootCert.configMapName }}
            - name: PGSSLROOTCERT
              value: {{ printf "/etc/ssl/postgres/%s" ($pgSslRootCert.key | default "ca.crt") | quote }}
            {{- end }}
            # ========================================================================
            # Identity Provider Configuration
            # ========================================================================
            {{- $idpProvider := include "auth-service.idpProvider" . }}
            {{- if eq $idpProvider "keycloak" }}
            # Keycloak Configuration
            {{- $keycloakSecretName := .Values.secrets.auth.keycloak.name | default ((((.Values.global).secrets).auth).keycloak).secretName | default "" }}
            {{- $keycloakSecretRequired := "secrets.auth.keycloak.name (or global.secrets.auth.keycloak.secretName) is required when a Keycloak service account credential is not set inline" }}
            - name: IDP_KEYCLOAK_SERVICE_ACCOUNT_CLIENT_ID
              {{- if .Values.config.idp.keycloak.serviceAccountClientId }}
              value: {{ .Values.config.idp.keycloak.serviceAccountClientId | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ required $keycloakSecretRequired $keycloakSecretName | quote }}
                  key: {{ (((((.Values.global).secrets).auth).keycloak).keys).serviceAccountClientId | default "service-account-client-id" | quote }}
              {{- end }}
            - name: IDP_KEYCLOAK_SERVICE_ACCOUNT_CLIENT_SECRET
              {{- if .Values.config.idp.keycloak.serviceAccountClientSecret }}
              value: {{ .Values.config.idp.keycloak.serviceAccountClientSecret | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ required $keycloakSecretRequired $keycloakSecretName | quote }}
                  key: {{ (((((.Values.global).secrets).auth).keycloak).keys).serviceAccountClientSecret | default "service-account-client-secret" | quote }}
              {{- end }}
            {{- else if eq $idpProvider "entra" }}
            # Microsoft Entra ID Configuration
            {{- $entraSecretName := .Values.secrets.auth.entra.name | default ((((.Values.global).secrets).auth).entra).secretName | default "" }}
            {{- $entraSecretRequired := "secrets.auth.entra.name (or global.secrets.auth.entra.secretName) is required when an Entra credential is not set inline" }}
            - name: IDP_CLIENT_ID
              {{- if .Values.config.idp.entra.clientId }}
              value: {{ .Values.config.idp.entra.clientId | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ required $entraSecretRequired $entraSecretName | quote }}
                  key: {{ (((((.Values.global).secrets).auth).entra).keys).clientId | default "client-id" | quote }}
              {{- end }}
            - name: IDP_CLIENT_SECRET
              {{- if .Values.config.idp.entra.clientSecret }}
              value: {{ .Values.config.idp.entra.clientSecret | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ required $entraSecretRequired $entraSecretName | quote }}
                  key: {{ (((((.Values.global).secrets).auth).entra).keys).clientSecret | default "client-secret" | quote }}
              {{- end }}
            {{- if or .Values.config.idp.entra.graphClientId $entraSecretName }}
            - name: IDP_ENTRA_GRAPH_CLIENT_ID
              {{- if .Values.config.idp.entra.graphClientId }}
              value: {{ .Values.config.idp.entra.graphClientId | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ required $entraSecretRequired $entraSecretName | quote }}
                  key: {{ (((((.Values.global).secrets).auth).entra).keys).graphClientId | default "graph-client-id" | quote }}
              {{- end }}
            - name: IDP_ENTRA_GRAPH_CLIENT_SECRET
              {{- if .Values.config.idp.entra.graphClientSecret }}
              value: {{ .Values.config.idp.entra.graphClientSecret | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ required $entraSecretRequired $entraSecretName | quote }}
                  key: {{ (((((.Values.global).secrets).auth).entra).keys).graphClientSecret | default "graph-client-secret" | quote }}
              {{- end }}
            {{- end }}
            {{- else }}
            # Auth0 Configuration
            {{- $authSecretName := .Values.secrets.auth.auth0.name | default ((((.Values.global).secrets).auth).auth0).secretName | default "" }}
            {{- $authSecretRequired := "secrets.auth.auth0.name (or global.secrets.auth.auth0.secretName) is required when an Auth0 credential is not set inline" }}
            - name: IDP_CLIENT_ID
              {{- if .Values.config.idp.auth0.clientId }}
              value: {{ .Values.config.idp.auth0.clientId | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ required $authSecretRequired $authSecretName | quote }}
                  key: {{ (((((.Values.global).secrets).auth).auth0).keys).clientId | default "client-id" | quote }}
              {{- end }}
            - name: IDP_CLIENT_SECRET
              {{- if .Values.config.idp.auth0.clientSecret }}
              value: {{ .Values.config.idp.auth0.clientSecret | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ required $authSecretRequired $authSecretName | quote }}
                  key: {{ (((((.Values.global).secrets).auth).auth0).keys).clientSecret | default "client-secret" | quote }}
              {{- end }}
            - name: IDP_AUTH0_MANAGEMENT_CLIENT_ID
              {{- if .Values.config.idp.auth0.managementClientId }}
              value: {{ .Values.config.idp.auth0.managementClientId | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ required $authSecretRequired $authSecretName | quote }}
                  key: {{ (((((.Values.global).secrets).auth).auth0).keys).mgmtClientId | default "mgmt-client-id" | quote }}
              {{- end }}
            - name: IDP_AUTH0_MANAGEMENT_CLIENT_SECRET
              {{- if .Values.config.idp.auth0.managementClientSecret }}
              value: {{ .Values.config.idp.auth0.managementClientSecret | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ required $authSecretRequired $authSecretName | quote }}
                  key: {{ (((((.Values.global).secrets).auth).auth0).keys).mgmtClientSecret | default "mgmt-client-secret" | quote }}
              {{- end }}
            {{- end }}
            # ========================================================================
            # Auth Service Configuration
            # ========================================================================
            {{- $authServiceSecretName := .Values.secrets.authService.name | default (((.Values.global).secrets).authService).secretName | default "" }}
            {{- $authServiceSecretRequired := "secrets.authService.name (or global.secrets.authService.secretName) is required when config.apiSecret or config.jwtSecret is empty" }}
            - name: API_SECRET
              {{- if .Values.config.apiSecret }}
              value: {{ .Values.config.apiSecret | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ required $authServiceSecretRequired $authServiceSecretName | quote }}
                  key: {{ ((((.Values.global).secrets).authService).keys).apiSecret | default "api-secret" | quote }}
              {{- end }}
            - name: JWT_SECRET
              {{- if .Values.config.jwtSecret }}
              value: {{ .Values.config.jwtSecret | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ required $authServiceSecretRequired $authServiceSecretName | quote }}
                  key: {{ ((((.Values.global).secrets).authService).keys).jwtSecret | default "jwt-secret" | quote }}
              {{- end }}
            # ========================================================================
            # Key Management Configuration
            # ========================================================================
            {{- $keyMgmtProvider := include "auth-service.keyManagementProvider" . }}
            {{- if eq $keyMgmtProvider "azure_key_vault" }}
            # Azure Key Vault Configuration
            {{- $azureKeyVaultSecretName := .Values.secrets.keyManagement.azure_key_vault.name | default ((((.Values.global).secrets).keyManagement).azure_key_vault).secretName | default "" }}
            {{- $azureKeyVaultSecretRequired := "secrets.keyManagement.azure_key_vault.name (or global.secrets.keyManagement.azure_key_vault.secretName) is required when an Azure Key Vault credential is not set inline" }}
            - name: AZURE_CLIENT_ID
              {{- if .Values.config.keyManagement.azure_key_vault.clientId }}
              value: {{ .Values.config.keyManagement.azure_key_vault.clientId | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ required $azureKeyVaultSecretRequired $azureKeyVaultSecretName | quote }}
                  key: {{ (((((.Values.global).secrets).keyManagement).azure_key_vault).keys).clientId | default "client-id" | quote }}
              {{- end }}
            - name: AZURE_CLIENT_SECRET
              {{- if .Values.config.keyManagement.azure_key_vault.clientSecret }}
              value: {{ .Values.config.keyManagement.azure_key_vault.clientSecret | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ required $azureKeyVaultSecretRequired $azureKeyVaultSecretName | quote }}
                  key: {{ (((((.Values.global).secrets).keyManagement).azure_key_vault).keys).clientSecret | default "client-secret" | quote }}
              {{- end }}
            {{- if and (not (((.Values.global).secrets).create)) $azureKeyVaultSecretName }}
            {{- if not .Values.config.keyManagement.azure_key_vault.vaultUrl }}
            - name: AZURE_KEY_VAULT_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $azureKeyVaultSecretName | quote }}
                  key: {{ (((((.Values.global).secrets).keyManagement).azure_key_vault).keys).vaultUrl | default "vault-url" | quote }}
                  optional: true
            {{- end }}
            {{- if not .Values.config.keyManagement.azure_key_vault.tenantId }}
            - name: AZURE_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $azureKeyVaultSecretName | quote }}
                  key: {{ (((((.Values.global).secrets).keyManagement).azure_key_vault).keys).tenantId | default "tenant-id" | quote }}
                  optional: true
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if eq $keyMgmtProvider "aws_kms" }}
            # AWS KMS Configuration
            {{- $awsKmsSecretName := .Values.secrets.keyManagement.aws_kms.name | default ((((.Values.global).secrets).keyManagement).aws_kms).secretName | default "" }}
            {{- $awsKmsSecretRequired := "secrets.keyManagement.aws_kms.name (or global.secrets.keyManagement.aws_kms.secretName) is required when an AWS KMS credential is not set inline" }}
            {{- $awsSecretsCreate := (((.Values.global).secrets).create) }}
            {{- $awsKmsValues := (and $awsSecretsCreate ((((((.Values.global).secrets).keyManagement).aws_kms).values))) | default dict }}
            {{- $awsSessionTokenFromSecret := and (not $awsSecretsCreate) $awsKmsSecretName }}
            {{- if not .Values.config.keyManagement.aws_kms.useIamRole }}
            - name: AWS_ACCESS_KEY_ID
              {{- if .Values.config.keyManagement.aws_kms.accessKeyId }}
              value: {{ .Values.config.keyManagement.aws_kms.accessKeyId | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ required $awsKmsSecretRequired $awsKmsSecretName | quote }}
                  key: {{ (((((.Values.global).secrets).keyManagement).aws_kms).keys).accessKeyId | default "access-key-id" | quote }}
              {{- end }}
            - name: AWS_SECRET_ACCESS_KEY
              {{- if .Values.config.keyManagement.aws_kms.secretAccessKey }}
              value: {{ .Values.config.keyManagement.aws_kms.secretAccessKey | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ required $awsKmsSecretRequired $awsKmsSecretName | quote }}
                  key: {{ (((((.Values.global).secrets).keyManagement).aws_kms).keys).secretAccessKey | default "secret-access-key" | quote }}
              {{- end }}
            {{- if or .Values.config.keyManagement.aws_kms.sessionToken $awsKmsValues.sessionToken $awsSessionTokenFromSecret }}
            - name: AWS_SESSION_TOKEN
              {{- if .Values.config.keyManagement.aws_kms.sessionToken }}
              value: {{ .Values.config.keyManagement.aws_kms.sessionToken | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ required $awsKmsSecretRequired $awsKmsSecretName | quote }}
                  key: {{ (((((.Values.global).secrets).keyManagement).aws_kms).keys).sessionToken | default "session-token" | quote }}
                  {{- if not $awsKmsValues.sessionToken }}
                  optional: true
                  {{- end }}
              {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if eq $keyMgmtProvider "gcp_kms" }}
            # GCP KMS Configuration
            {{- $gcpKmsSecretName := .Values.secrets.keyManagement.gcp_kms.name | default ((((.Values.global).secrets).keyManagement).gcp_kms).secretName | default "" }}
            {{- if or .Values.config.keyManagement.gcp_kms.serviceAccountJson $gcpKmsSecretName }}
            - name: GCP_CREDENTIALS_JSON
              {{- if .Values.config.keyManagement.gcp_kms.serviceAccountJson }}
              value: {{ .Values.config.keyManagement.gcp_kms.serviceAccountJson | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ $gcpKmsSecretName | quote }}
                  key: {{ (((((.Values.global).secrets).keyManagement).gcp_kms).keys).serviceAccountJson | default "service-account-json" | quote }}
                  # Absent when using Workload Identity or Application Default Credentials
                  optional: true
              {{- end }}
            {{- end }}
            {{- end }}
            {{- if eq $keyMgmtProvider "openbao" }}
            # OpenBao Transit: no credential environment variables; the CA bundle and
            # the projected token or token Secret are mounted as files (see volumes)
            {{- end }}
            {{- if .Values.config.serviceAccounts.governanceWorker.enabled }}
            # ========================================================================
            # Governance Worker Configuration
            # ========================================================================
            {{- $workerSecretName := .Values.secrets.governanceWorker.name | default (((.Values.global).secrets).governanceWorker).secretName | default "" }}
            {{- $workerSecretRequired := "secrets.governanceWorker.name (or global.secrets.governanceWorker.secretName) is required when a governance worker credential is not set inline" }}
            {{- $workerClientIdKey := ((((.Values.global).secrets).governanceWorker).keys).clientId | default "client-id" }}
            {{- $workerClientSecretKey := ((((.Values.global).secrets).governanceWorker).keys).clientSecret | default "client-secret" }}
            - name: SERVICE_ACCOUNT_ENCRYPTION_KEY
              {{- if .Values.config.serviceAccounts.governanceWorker.encryptionKey }}
              value: {{ .Values.config.serviceAccounts.governanceWorker.encryptionKey | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ required $workerSecretRequired $workerSecretName | quote }}
                  key: {{ ((((.Values.global).secrets).governanceWorker).keys).encryptionKey | default "encryption-key" | quote }}
              {{- end }}
            {{- if or (eq $idpProvider "auth0") (not $idpProvider) }}
            - name: AUTH0_GOVERNANCE_WORKER_CLIENT_ID
              {{- if .Values.config.serviceAccounts.governanceWorker.clientId }}
              value: {{ .Values.config.serviceAccounts.governanceWorker.clientId | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ required $workerSecretRequired $workerSecretName | quote }}
                  key: {{ $workerClientIdKey | quote }}
              {{- end }}
            - name: AUTH0_GOVERNANCE_WORKER_CLIENT_SECRET
              {{- if .Values.config.serviceAccounts.governanceWorker.clientSecret }}
              value: {{ .Values.config.serviceAccounts.governanceWorker.clientSecret | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ required $workerSecretRequired $workerSecretName | quote }}
                  key: {{ $workerClientSecretKey | quote }}
              {{- end }}
            {{- end }}
            {{- if eq $idpProvider "keycloak" }}
            - name: KEYCLOAK_GOVERNANCE_WORKER_CLIENT_ID
              {{- if .Values.config.serviceAccounts.governanceWorker.clientId }}
              value: {{ .Values.config.serviceAccounts.governanceWorker.clientId | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ required $workerSecretRequired $workerSecretName | quote }}
                  key: {{ $workerClientIdKey | quote }}
              {{- end }}
            - name: KEYCLOAK_GOVERNANCE_WORKER_CLIENT_SECRET
              {{- if .Values.config.serviceAccounts.governanceWorker.clientSecret }}
              value: {{ .Values.config.serviceAccounts.governanceWorker.clientSecret | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ required $workerSecretRequired $workerSecretName | quote }}
                  key: {{ $workerClientSecretKey | quote }}
              {{- end }}
            {{- end }}
            {{- if eq $idpProvider "entra" }}
            - name: ENTRA_GOVERNANCE_WORKER_CLIENT_ID
              {{- if .Values.config.serviceAccounts.governanceWorker.clientId }}
              value: {{ .Values.config.serviceAccounts.governanceWorker.clientId | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ required $workerSecretRequired $workerSecretName | quote }}
                  key: {{ $workerClientIdKey | quote }}
              {{- end }}
            - name: ENTRA_GOVERNANCE_WORKER_CLIENT_SECRET
              {{- if .Values.config.serviceAccounts.governanceWorker.clientSecret }}
              value: {{ .Values.config.serviceAccounts.governanceWorker.clientSecret | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ required $workerSecretRequired $workerSecretName | quote }}
                  key: {{ $workerClientSecretKey | quote }}
              {{- end }}
            {{- end }}
            {{- end }}
            {{- if .Values.config.tokenExchange.enabled }}
            # ========================================================================
            # Token Exchange Configuration
            # ========================================================================
            - name: AUTH_SERVICE_PRIVATE_KEY
              {{- if .Values.config.tokenExchange.privateKey }}
              value: {{ .Values.config.tokenExchange.privateKey | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.auth.keycloak.name | default ((((.Values.global).secrets).auth).keycloak).secretName | required "secrets.auth.keycloak.name (or global.secrets.auth.keycloak.secretName) is required when tokenExchange is enabled and config.tokenExchange.privateKey is empty" | quote }}
                  key: {{ (((((.Values.global).secrets).auth).keycloak).keys).tokenExchangePrivateKey | default "token-exchange-private-key" | quote }}
              {{- end }}
            {{- end }}
            {{- with .Values.extraEnvVars }}
            # ========================================================================
            # Extra Environment Variables
            # ========================================================================
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- $pgSslRootCert := (((.Values.global).postgresql).sslRootCert) | default dict }}

          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- if or $pgSslRootCert.secretName $pgSslRootCert.configMapName }}
            - name: postgres-ca
              mountPath: /etc/ssl/postgres
              readOnly: true
            {{- end }}
            {{- if eq (include "auth-service.keyManagementProvider" .) "openbao" }}
            {{- $bao := .Values.config.keyManagement.openbao }}
            {{- if or $bao.ca.secretName $bao.ca.configMapName }}
            - name: openbao-ca
              mountPath: /etc/openbao/ca
              readOnly: true
            {{- end }}
            {{- if eq $bao.auth.method "kubernetes" }}
            - name: openbao-token
              mountPath: /var/run/secrets/openbao
              readOnly: true
            {{- else }}
            - name: openbao-token
              mountPath: /etc/openbao/token
              readOnly: true
            {{- end }}
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- with .Values.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        {{- if $pgSslRootCert.secretName }}
        - name: postgres-ca
          secret:
            secretName: {{ $pgSslRootCert.secretName | quote }}
            items:
              - key: {{ $pgSslRootCert.key | default "ca.crt" | quote }}
                path: {{ $pgSslRootCert.key | default "ca.crt" | quote }}
        {{- else if $pgSslRootCert.configMapName }}
        - name: postgres-ca
          configMap:
            name: {{ $pgSslRootCert.configMapName | quote }}
            items:
              - key: {{ $pgSslRootCert.key | default "ca.crt" | quote }}
                path: {{ $pgSslRootCert.key | default "ca.crt" | quote }}
        {{- end }}
        {{- if eq (include "auth-service.keyManagementProvider" .) "openbao" }}
        {{- $bao := .Values.config.keyManagement.openbao }}
        {{- $caKey := $bao.ca.key | default "ca.pem" }}
        {{- if $bao.ca.secretName }}
        - name: openbao-ca
          secret:
            secretName: {{ $bao.ca.secretName | quote }}
            items:
              - key: {{ $caKey | quote }}
                path: {{ $caKey | quote }}
        {{- else if $bao.ca.configMapName }}
        - name: openbao-ca
          configMap:
            name: {{ $bao.ca.configMapName | quote }}
            items:
              - key: {{ $caKey | quote }}
                path: {{ $caKey | quote }}
        {{- end }}
        {{- if eq $bao.auth.method "kubernetes" }}
        # Projected token: bound to the audience the OpenBao role expects, rotated by
        # the kubelet before expiry; Auth rereads the file for every login.
        - name: openbao-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: {{ $bao.auth.audience | quote }}
                  expirationSeconds: {{ $bao.auth.tokenExpirationSeconds | default 3600 }}
        {{- else }}
        {{- $tokenKey := $bao.auth.tokenKey | default "token" }}
        - name: openbao-token
          secret:
            secretName: {{ include "auth-service.openbaoTokenSecretName" . | quote }}
            items:
              - key: {{ $tokenKey | quote }}
                path: {{ $tokenKey | quote }}
        {{- end }}
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
