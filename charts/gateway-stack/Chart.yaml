apiVersion: v2
name: gateway-stack
description: A Helm chart for deploying the Agent Gateway stack - LLM Gateway and Control Plane
type: application
version: 1.2.1
appVersion: "1.2.1"
home: https://github.com/eqtylab/guardian-infrastructure
sources:
  - https://github.com/eqtylab/guardian-infrastructure/tree/main/charts/gateway-stack
maintainers:
  - name: EQTY Lab
    email: support@eqtylab.io
dependencies:
  # PostgreSQL - registry and audit store for llm-gateway and control-plane
  - name: postgresql
    repository: oci://registry-1.docker.io/bitnamicharts
    version: ">=16.0.0 <17.0.0"
    condition: postgresql.enabled
  # HAProxy ingress controller - opt-in, for installs without an existing controller
  - name: kubernetes-ingress
    alias: haproxyIngress
    repository: oci://ghcr.io/haproxytech/helm-charts
    version: ">=1.0.0 <2.0.0"
    condition: haproxyIngress.enabled
