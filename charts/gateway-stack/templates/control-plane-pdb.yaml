{{- if and .Values.enabled .Values.controlPlane.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "gateway-stack.fullname" . }}-control-plane
  labels:
    {{- include "gateway-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  {{- if gt (int .Values.controlPlane.replicaCount) 1 }}
  minAvailable: {{ .Values.controlPlane.podDisruptionBudget.minAvailable }}
  {{- else }}
  maxUnavailable: {{ .Values.controlPlane.podDisruptionBudget.maxUnavailable | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "gateway-stack.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: control-plane
{{- end }}
