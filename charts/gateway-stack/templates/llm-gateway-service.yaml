{{- if and .Values.enabled .Values.llmGateway.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gateway-stack.fullname" . }}-llm-gateway
  labels:
    {{- include "gateway-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: llm-gateway
spec:
  type: {{ .Values.llmGateway.service.type }}
  ports:
    - port: {{ .Values.llmGateway.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "gateway-stack.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: llm-gateway
{{- end }}
