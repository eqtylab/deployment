{{- if .Values.enabled }}
{{- $credentialSigner := .Values.llmGateway.registration.credentialSigner }}
{{- if and $credentialSigner.seed (not $credentialSigner.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gateway-stack.llmGatewayCredentialSignerSecretName" . }}
  labels:
    {{- include "gateway-stack.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ $credentialSigner.secretKey | default "seed" }}: {{ $credentialSigner.seed | quote }}
{{- end }}
{{- end }}
