{{- if .Values.enabled }}
{{- $bundledAuth := (.Values.postgresql).auth | default dict }}
{{- if and .Values.postgresql.enabled (not $bundledAuth.existingSecret) (eq ($bundledAuth.password | default "") "change-me") }}
{{- fail "postgresql.auth.password must not be the default value 'change-me' when postgresql.enabled=true and no postgresql.auth.existingSecret is provided" }}
{{- end }}
{{- if not .Values.database.existingSecret }}
{{- if eq (.Values.database.password | default "") "change-me" }}
{{- fail "database.password must not be the default value 'change-me' when no database.existingSecret is provided" }}
{{- end }}
{{- $dsnUser := .Values.database.user | urlquery | replace "+" "%20" }}
{{- $dsnPassword := .Values.database.password | urlquery | replace "+" "%20" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gateway-stack.dbSecretName" . }}
  labels:
    {{- include "gateway-stack.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.database.secretKeys.username }}: {{ .Values.database.user | quote }}
  {{ .Values.database.secretKeys.password }}: {{ .Values.database.password | quote }}
  {{ .Values.database.secretKeys.database }}: {{ .Values.database.name | quote }}
  {{ .Values.database.secretKeys.dsn }}: {{ printf "postgres://%s:%s@%s:%d/%s?sslmode=%s" $dsnUser $dsnPassword (include "gateway-stack.dbHost" .) (int .Values.database.port) .Values.database.name .Values.database.sslMode | quote }}
{{- end }}
{{- end }}
