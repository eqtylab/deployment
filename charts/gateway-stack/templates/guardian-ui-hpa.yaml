{{- if and .Values.enabled .Values.guardianUI.enabled .Values.guardianUI.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "gateway-stack.uiServiceName" . }}
  labels:
    {{- include "gateway-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: guardian-ui
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "gateway-stack.uiServiceName" . }}
  minReplicas: {{ .Values.guardianUI.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.guardianUI.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.guardianUI.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.guardianUI.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.guardianUI.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.guardianUI.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
