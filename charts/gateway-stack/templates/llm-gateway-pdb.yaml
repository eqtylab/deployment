{{- if and .Values.enabled .Values.llmGateway.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "gateway-stack.fullname" . }}-llm-gateway
  labels:
    {{- include "gateway-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: llm-gateway
spec:
  {{- if gt (int .Values.llmGateway.replicaCount) 1 }}
  minAvailable: {{ .Values.llmGateway.podDisruptionBudget.minAvailable }}
  {{- else }}
  maxUnavailable: {{ .Values.llmGateway.podDisruptionBudget.maxUnavailable | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "gateway-stack.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: llm-gateway
{{- end }}
