{{- if and .Values.enabled .Values.haproxyIngress.enabled }}
{{- $tls := .Values.haproxyIngress.controller.defaultTLSSecret | default dict }}
{{- if and (dig "enabled" true $tls) $tls.create }}
{{- if not $tls.secret }}
{{- fail "haproxyIngress.controller.defaultTLSSecret.secret must name the default certificate Secret when haproxyIngress.controller.defaultTLSSecret.create=true" }}
{{- end }}
{{- $namespace := .Values.haproxyIngress.namespaceOverride | default .Release.Namespace }}
{{- if and $tls.secretNamespace (not (contains "kubernetes-ingress.namespace" $tls.secretNamespace)) }}
{{- $namespace = tpl $tls.secretNamespace . }}
{{- end }}
{{- $existing := lookup "v1" "Secret" $namespace $tls.secret }}
{{- $unmanaged := and $existing (not (dig "metadata" "annotations" "meta.helm.sh/release-name" "" $existing)) }}
{{- if not $unmanaged }}
apiVersion: v1
kind: Secret
type: kubernetes.io/tls
metadata:
  name: {{ $tls.secret }}
  namespace: {{ $namespace }}
  labels:
    {{- include "gateway-stack.labels" . | nindent 4 }}
data:
{{- if and $existing (dig "data" "tls.crt" "" $existing) (dig "data" "tls.key" "" $existing) }}
  tls.crt: {{ index $existing.data "tls.crt" }}
  tls.key: {{ index $existing.data "tls.key" }}
{{- else }}
{{- $ca := genCA "gateway-stack-haproxy-ca" 365 }}
{{- $cert := genSignedCert (printf "%s.%s" .Release.Name $namespace) nil nil 365 $ca }}
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
