{{- if and .Values.enabled .Values.llmGateway.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gateway-stack.llmGatewayServiceAccountName" . }}
  labels:
    {{- include "gateway-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: llm-gateway
  {{- with .Values.llmGateway.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.llmGateway.serviceAccount.automount }}
{{- end }}
