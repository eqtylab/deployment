{{- if and .Values.enabled (or .Values.controlPlane.auth.enabled .Values.llmGateway.registration.enabled) (not .Values.controlPlane.auth.existingSecret) }}
{{- $auth := .Values.controlPlane.auth }}
{{- $registrationTokenSecret := required "controlPlane.auth.registrationTokenSecret is required when auth is enabled or llmGateway.registration.enabled and no existingSecret is provided" $auth.registrationTokenSecret }}
{{- if eq $registrationTokenSecret "change-me" }}
{{- fail "controlPlane.auth.registrationTokenSecret must not be the default value 'change-me' when controlPlane.auth.enabled=true or llmGateway.registration.enabled=true and no existingSecret is provided" }}
{{- end }}
{{- if and $auth.enabled $auth.google.enabled }}
{{- $_ := required "controlPlane.auth.stateSecret is required when auth.google.enabled=true and no existingSecret is provided" $auth.stateSecret }}
{{- $_ := required "controlPlane.auth.google.clientID is required when auth.google.enabled=true and no existingSecret is provided" $auth.google.clientID }}
{{- $_ := required "controlPlane.auth.google.clientSecret is required when auth.google.enabled=true and no existingSecret is provided" $auth.google.clientSecret }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gateway-stack.controlPlaneAuthSecretName" . }}
  labels:
    {{- include "gateway-stack.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if and $auth.enabled $auth.google.enabled }}
  {{ $auth.secretKeys.stateSecret }}: {{ $auth.stateSecret | quote }}
  {{- end }}
  {{ $auth.secretKeys.registrationTokenSecret }}: {{ $registrationTokenSecret | quote }}
  {{- if and $auth.enabled $auth.google.enabled }}
  {{ $auth.secretKeys.googleClientID }}: {{ $auth.google.clientID | quote }}
  {{ $auth.secretKeys.googleClientSecret }}: {{ $auth.google.clientSecret | quote }}
  {{- end }}
{{- end }}
