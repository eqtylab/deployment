{{- if and .Values.enabled .Values.guardianUI.enabled .Values.guardianUI.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gateway-stack.uiServiceName" . }}
  labels:
    {{- include "gateway-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: guardian-ui
spec:
  type: {{ .Values.guardianUI.service.type }}
  ports:
    - port: {{ .Values.guardianUI.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "gateway-stack.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: guardian-ui
{{- end }}
