{{- if and .Values.enabled .Values.guardianUI.enabled .Values.guardianUI.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "gateway-stack.uiServiceName" . }}
  labels:
    {{- include "gateway-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: guardian-ui
spec:
  {{- if gt (int .Values.guardianUI.replicaCount) 1 }}
  minAvailable: {{ .Values.guardianUI.podDisruptionBudget.minAvailable }}
  {{- else }}
  maxUnavailable: {{ .Values.guardianUI.podDisruptionBudget.maxUnavailable | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "gateway-stack.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: guardian-ui
{{- end }}
