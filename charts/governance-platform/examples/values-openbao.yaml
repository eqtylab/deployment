# Governance Platform with Auth signing keys in OpenBao Transit.
#
# Layer this over an identity-provider example (values-keycloak.yaml for a
# fully local stack) and a database example. It selects the OpenBao provider
# globally, so no cloud KMS Secret is created or mounted, and points Auth at an
# externally managed OpenBao endpoint using Kubernetes workload authentication.
#
# Prerequisites (operator-managed, outside this chart): a reachable OpenBao with
# a dedicated Transit mount and scoped policy for Auth, a Kubernetes auth mount
# and role bound to this release's auth-service ServiceAccount, namespace and
# audience, and a TokenReview reviewer on OpenBao.
# Requires an auth-service image that includes eqtylab/guardian#271 (the first release after 1.2.0 ships it).
# Set global.environmentType as for any other deployment; the provider is not
# tied to the development environment.
global:
  secrets:
    keyManagement:
      provider: openbao

auth-service:
  config:
    keyManagement:
      # The identity-provider examples pin a cloud provider here; the chart value
      # wins over the global, so select openbao at both levels.
      provider: openbao
      openbao:
        # Bundled custody chart address. The bundled openbao-custody chart is an optional integration not yet approved for production rollout: for production, point Auth at a customer-operated OpenBao that meets your availability and recovery requirements, or qualify the bundled chart first.
        address: https://openbao-custody-active.custody.svc.cluster.local:8200
        transitMount: guardian-did
        keyPrefix: guardian
        ca:
          configMapName: openbao-ca
          key: ca.pem
        auth:
          method: kubernetes
          mount: kubernetes
          role: guardian-auth
          audience: openbao
