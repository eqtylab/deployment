    # ---------------------------------------------------------------------------

    # -- Integrity Service URL
    # @default -- `""` (auto-generated: "http://{Release.Name}-integrity-service:3050")
    integrityServiceUrl: ""

    # -- Auth Service URL
    # @default -- `""` (auto-generated: "http://{Release.Name}-auth-service:8080")
    authServiceUrl: ""

    # -- PDF Generation Service URL
    # @default -- `""` (auto-generated: "http://{Release.Name}-eqty-pdfgen:8080")
    # PDF generation service base URL for policy report rendering
    pdfgenServiceUrl: ""

    # ---------------------------------------------------------------------------
    # Service Account Configuration
    # ---------------------------------------------------------------------------

    # -- Service Account Configuration
    # @default -- See values below
    # Configuration for worker authentication
    serviceAccount:
      # -- Enable Service Account
      # @default -- `true`
      # Enable service account authentication for worker
      enabled: true
      # -- Auth Service URL
      # @default -- `""`
      # Auth service URL for token retrieval (falls back to config.authServiceUrl)
      authServiceUrl: ""
      # -- Auth Service API Key
      # @default -- `""` (auto-configured from global.secrets.authService)
      authServiceApiKey: ""
      # -- Service Name
      # @default -- `governance-worker`
      # Service account name
      serviceName: "governance-worker"
      # -- Existing Secret
      # @default -- `""` (falls back to secrets.authService)
      # Override secret name for API key
      existingSecret: ""
      # -- Existing Secret Keys
      # @default -- See values below
      existingSecretKeys:
        # -- API Key
        # @default -- `api-secret`
        apiKey: "api-secret"

  # -- Local Storage CA
  # @default -- See values below
  # Additional trusted CA for a local HTTPS artifact storage endpoint (exposed through SSL_CERT_DIR)
  localStorageCA:
    # -- ConfigMap Name
    # @default -- `""`
    # ConfigMap holding the public PEM CA (empty disables the mount)
    configMapName: ""
    # -- ConfigMap Key
    # @default -- `ca.pem`
    key: ca.pem

  # -- Host Aliases
  # @default -- `[]`
  # Optional pod host aliases (local qualification DNS only)
  hostAliases: []

