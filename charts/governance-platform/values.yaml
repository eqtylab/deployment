    # @default -- `""`
    # **REQUIRED for Auth0**: SPA client ID (public, not a secret)
    # Only used when authProvider is "auth0"
    auth0ClientId: ""

    # -- Auth0 Audience
    # @default -- `""`
    # **REQUIRED for Auth0**: API audience (e.g., "https://your-tenant.us.auth0.com/api/v2/")
    # Only used when authProvider is "auth0"
    auth0Audience: ""

    # -- Entra Client ID
    # @default -- `""`
    # **REQUIRED for Entra**: Application (client) ID from Azure app registration (public, not a secret)
    # Only used when authProvider is "entra"
    entraClientId: ""

    # -- Entra Tenant ID
    # @default -- `""`
    # **REQUIRED for Entra**: Directory (tenant) ID from Azure
    # Only used when authProvider is "entra"
    entraTenantId: ""

    # -- Entra Scopes
    # @default -- `"openid profile email offline_access api://<backend-client-id>/access_as_user"`
    # Space-separated list of OAuth scopes requested during login
    # **REQUIRED for Entra**: Replace `<backend-client-id>` with the Governance Platform Backend app registration ID
    # Only used when authProvider is "entra"
    entraScopes: "openid profile email offline_access api://<backend-client-id>/access_as_user"

    # -- Entra Authority
    # @default -- `""` (defaults to "https://login.microsoftonline.com/<tenantId>")
    # Optional override for the Entra authority URL
    # Only used when authProvider is "entra"
    entraAuthority: ""

    # -- Keycloak URL
    # @default -- `""`
    # **REQUIRED for Keycloak**: Server URL (e.g., "https://keycloak.example.com")
    # Only used when authProvider is "keycloak"
    keycloakUrl: ""

    # -- Keycloak Client ID
    # @default -- `""`
    # **REQUIRED for Keycloak**: SPA client ID (public, e.g., "governance-platform-frontend")
    # Only used when authProvider is "keycloak"
    keycloakClientId: ""

    # -- Keycloak Realm
    # @default -- `""`
    # **REQUIRED for Keycloak**: Realm name (e.g., "governance")
    # Only used when authProvider is "keycloak"
    keycloakRealm: ""

    # ---------------------------------------------------------------------------
    # Application Settings
    # ---------------------------------------------------------------------------

    # -- Environment
    # @default -- `""` (auto-configured from global.environmentType, defaults to "development")
    # Environment label
    environment: ""

    # -- App Title
    # @default -- `Governance Studio`
    # Application title displayed in browser and UI
    appTitle: "Governance Studio"

    # -- Display Timezone
    # @default -- `UTC`
    # Timezone used for displayed timestamps; defaults to UTC unless set to an IANA timezone name (e.g. America/New_York, Europe/London)
    displayTimezone: "UTC"

    # ---------------------------------------------------------------------------
    # Feature Flags
    # ---------------------------------------------------------------------------

    # -- Feature Flags
    # @default -- See values below
    features:
      # -- Governance Features
      # @default -- `true`
      # Enable core governance features
      governance: true

      # -- Lineage Features
      # @default -- `true`
      # Enable lineage and integrity features (requires integrity-service)
      lineage: true

# =============================================================================
# Integrity Service
# =============================================================================
# Default values for the integrity-service Helm chart
# ------------------------------------------------------------------------------
integrity-service:
  # -- Enable Service
  # @default -- `true`
  # Enable the Integrity Service for lineage and verifiable credentials
  enabled: true

  # -- Replica Count
  # @default -- `2`
  # Number of pod replicas to run (ignored if autoscaling.enabled is true)
  replicaCount: 2

  # -- Image Configuration
  # @default -- See values below
  # Container image settings for the Integrity Service
  image:
    # -- Image Repository
    # @default -- `ghcr.io/eqtylab/integrity-service`
    repository: ghcr.io/eqtylab/integrity-service
    # -- Image Pull Policy
    # @default -- `IfNotPresent`
    # Options: IfNotPresent, Always, Never
    pullPolicy: IfNotPresent
    # -- Image Tag
    # @default -- `""` (uses chart appVersion)
    tag: ""
    # -- Image Digest
    # @default -- `""`
    # Immutable sha256 digest; takes precedence over tag when set
    digest: ""

  # -- Image Pull Secrets
  # @default -- `[]` (auto-configured from global.secrets.imageRegistry.secretName)
  # Additional secrets for pulling images from private registries
  imagePullSecrets: []

  # -- Name Override
  # @default -- `""`
  # Override the chart name used for resource naming
  nameOverride: ""

  # -- Full Name Override
  # @default -- `""`
  # Override the full name used for resource naming
  fullnameOverride: ""

  # -- Service Account Configuration
  # @default -- See values below
  serviceAccount:
    # -- Create Service Account
    # @default -- `false`
    create: false
    # -- Automount API Credentials
    # @default -- `true`
    automount: true
    # -- Service Account Annotations
    # @default -- `{}`
    annotations: {}
    # -- Service Account Name
    # @default -- `""` (generated if create is true)
    name: ""

  # -- Pod Annotations
  # @default -- `{}`
  # Additional annotations to add to pods
  podAnnotations: {}

  # -- Pod Labels
  # @default -- `{}`
  # Additional labels to add to pods
  podLabels: {}

  # -- Pod Security Context
  # @default -- `{}`
  # Security context applied at the pod level
  podSecurityContext:
    runAsNonRoot: true

  # -- Container Security Context
  # @default -- See values below
  # Security context applied at the container level
  securityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  # -- Service Configuration
  # @default -- See values below
  service:
    # -- Enable Service
    # @default -- `true`
    enabled: true
    # -- Service Type
    # @default -- `ClusterIP`
    # Options: ClusterIP, NodePort, LoadBalancer
    type: ClusterIP
    # -- Service Port
    # @default -- `3050`
    port: 3050

  # -- Ingress Configuration
  # @default -- See values below
  ingress:
    # -- Enable Ingress
    # @default -- `false`
    enabled: false
    # -- Ingress Class Name
    # @default -- `""`
    # Example: "nginx", "traefik"
    className: ""
    # -- Ingress Annotations
    # @default -- `{}`
    annotations: {}
      # cert-manager.io/issuer: "letsencrypt-prod"
      # nginx.ingress.kubernetes.io/rewrite-target: /$2
      # nginx.ingress.kubernetes.io/proxy-body-size: "64m"
    # -- Ingress Hosts
    # @default -- See values below
    hosts:
      - host: governance.example.com
        paths:
          # Path uses regex for nginx rewrite - requires rewrite-target annotation
          - path: "/integrityService(/|$)(.*)"
            pathType: ImplementationSpecific
    # -- TLS Configuration
    # @default -- `[]`
    tls: []
      # - secretName: integrity-service-tls
      #   hosts:
      #     - governance.example.com

  # -- Resource Configuration
  # @default -- `{}`
  # CPU and memory resource requests and limits
  resources: {}
    # requests:
    #   cpu: 100m
    #   memory: 256Mi
    # limits:
    #   cpu: 500m
    #   memory: 512Mi

  # -- Autoscaling Configuration
  # @default -- See values below
  autoscaling:
    # -- Enable Autoscaling
    # @default -- `false`
    enabled: false
    # -- Minimum Replicas
    # @default -- `1`
    minReplicas: 1
    # -- Maximum Replicas
    # @default -- `100`
    maxReplicas: 100
    # -- Target CPU Utilization
    # @default -- `80`
    targetCPUUtilizationPercentage: 80
    # -- Target Memory Utilization
    # @default -- `80`
    targetMemoryUtilizationPercentage: 80

  # -- Pod Disruption Budget
  # @default -- See values below
  podDisruptionBudget:
    # -- Enable PDB
    # @default -- `true`
    enabled: true
    # -- Minimum Available
    # @default -- `1`
    # Only rendered when replicaCount > 1
    minAvailable: 1
    # -- Maximum Unavailable
    # @default -- `1`
    # Only rendered when replicaCount <= 1; allows eviction of single-replica pods during node drains
    # Setting this to `0` may block node drains and cluster upgrades
    maxUnavailable: 1

  # -- Node Selector
  # @default -- `{}`
  # Node labels for pod assignment
  nodeSelector: {}

  # -- Tolerations
  # @default -- `[]`
  # Tolerations for pod assignment
  tolerations: []

  # -- Affinity
  # @default -- `{}`
  # Affinity rules for pod assignment
  affinity: {}

  # -- Init Containers
  # @default -- `[]`
  # Init containers to add to the pod
  initContainers: []

  # -- Startup Probe
  # @default -- See values below
  startupProbe:
    httpGet:
      path: /health/v1
      port: http
    failureThreshold: 30
    periodSeconds: 10

  # -- Liveness Probe
  # @default -- See values below
  livenessProbe:
    httpGet:
      path: /health/v1
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3

  # -- Readiness Probe
  # @default -- See values below
  readinessProbe:
    httpGet:
      path: /health/v1
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 2

  # =============================================================================
  # PERSISTENCE CONFIGURATION
  # =============================================================================
  persistence:
    # -- Enable Persistence
    # @default -- `false`
    # Enable persistent volume for integrity data
    enabled: false

    # -- Integrity Data Volume
    # @default -- See values below
    integrity:
      # -- Mount Path
      # @default -- `/data/integrity`
      mountPath: /data/integrity
      # -- Host Path
      # @default -- `/var/lib/integrity`
      # Only used when persistence.enabled is true
      hostPath: /var/lib/integrity
      # -- Use an existing PVC instead of a node-local hostPath
      # @default -- `""`
      existingClaim: ""

  # =============================================================================
  # DATABASE CONFIGURATION
  # =============================================================================

  # -- External Database Configuration
  # @default -- See values below
  externalDatabase:
    # -- Database Host
    # @default -- `""` (auto-configured from global.postgresql.host, then "{Release.Name}-postgresql")
    host: ""
    # -- Database Port
    # @default -- `""` (auto-configured from global.postgresql.port, defaults to 5432)
    port: ""
    # -- Database Name
    # @default -- `IntegrityServiceDB`
    name: "IntegrityServiceDB"
    # -- Database User
    # @default -- `""` (auto-configured from global.postgresql.username, defaults to "postgres")
    user: ""
    # -- Database Password
    # @default -- `""` (auto-configured from global.secrets.database)
    password: ""
    # -- SSL Mode
    # @default -- `""` (auto-configured from global.postgresql.sslMode, defaults to "disable")
    # Options: disable, require, verify-ca, verify-full
    sslMode: ""

    # -- Password Secret Reference
    # @default -- See values below
    passwordSecretKeyRef:
      # -- Secret Name
      # @default -- `""` (auto-configured from global.secrets.database.secretName)
      name: ""
      # -- Secret Key
      # @default -- `""` (defaults to "password")
      key: ""

  # =============================================================================
  # APPLICATION CONFIGURATION
  # =============================================================================
  config:
    # -- Rust Environment
    # @default -- `""` (auto-configured from global.environmentType)
    rustEnv: ""

    # ---------------------------------------------------------------------------
    # Storage Configuration
    # ---------------------------------------------------------------------------

    # -- Blob Store Type
    # @default -- `""`
    # **REQUIRED**: Blob storage backend type
    # Options: aws_s3, azure_blob, gcs, local_fs
    integrityAppBlobStoreType: ""
    # -- Local filesystem path (requires a persistent mount for retained data)
    # @default -- `""`
    integrityAppBlobStoreLocalPath: ""

    # -- AWS S3 Region
    # @default -- `""`
    # **REQUIRED for S3**: AWS region (e.g., "us-east-1")
    # Only used when integrityAppBlobStoreType is "aws_s3"
    integrityAppBlobStoreAwsRegion: ""

    # -- AWS S3 Bucket
    # @default -- `""`
    # **REQUIRED for S3**: Bucket name
    # Only used when integrityAppBlobStoreType is "aws_s3"
    integrityAppBlobStoreAwsBucket: ""

    # -- AWS S3 Folder
    # @default -- `""`
    # **REQUIRED for S3**: Folder/Prefix
    # Only used when integrityAppBlobStoreType is "aws_s3"
    integrityAppBlobStoreAwsFolder: ""

    # -- AWS Access Key ID
    # @default -- `""` (auto-configured from global.secrets.storage.aws_s3)
    # Only used when integrityAppBlobStoreType is "aws_s3"
    integrityAppBlobStoreAwsAccessKeyId: ""

    # -- AWS Secret Access Key
    # @default -- `""` (auto-configured from global.secrets.storage.aws_s3)
    # Only used when integrityAppBlobStoreType is "aws_s3"
    integrityAppBlobStoreAwsSecretAccessKey: ""

    # -- Use AWS IAM role for S3 access instead of static credentials
    # @default -- `false`
    # Omits the credential env vars so the AWS SDK uses its default chain (IRSA, instance profile)
    # Only used when integrityAppBlobStoreType is "aws_s3"
    integrityAppBlobStoreAwsUseIamRole: false

    # -- Azure Storage Account
    # @default -- `""`
    # **REQUIRED for Azure**: Storage account name
    # Only used when integrityAppBlobStoreType is "azure_blob"
    integrityAppBlobStoreAccount: ""

    # -- Azure Container Name
    # @default -- `""`
    # **REQUIRED for Azure**: Container name
    # Only used when integrityAppBlobStoreType is "azure_blob"
    integrityAppBlobStoreContainer: ""

    # -- Azure Storage Account Key
    # @default -- `""` (auto-configured from global.secrets.storage.azure_blob)
    # Only used when integrityAppBlobStoreType is "azure_blob"
    integrityAppBlobStoreKey: ""

    # -- GCS Bucket Name
    # @default -- `""`
    # **REQUIRED for GCS**: Bucket name
    # Only used when integrityAppBlobStoreType is "gcs"
    integrityAppBlobStoreGcsBucket: ""

    # -- GCS Folder
    # @default -- `""`
    # **REQUIRED for GCS**: Folder/Prefix
    # Only used when integrityAppBlobStoreType is "gcs"
    integrityAppBlobStoreGcsFolder: ""

    # ---------------------------------------------------------------------------
    # Logging Configuration
    # ---------------------------------------------------------------------------

    # -- Default Log Level
    # @default -- `warn`
    # Options: trace, debug, info, warn, error
    integrityAppLoggingLogLevelDefault: "warn"

    # -- Service Log Level
    # @default -- `trace`
    # Integrity service specific log level
    # Options: trace, debug, info, warn, error
    integrityAppLoggingLogLevelIntegrityService: "trace"

    # ---------------------------------------------------------------------------
    # Authentication Configuration
    # ---------------------------------------------------------------------------

    # -- Auth Type
    # @default -- `auth_service`
    integrityAppAuthType: "auth_service"

    # -- Auth Service URL
    # @default -- `""` (auto-generated: "http://{Release.Name}-auth-service:8080")
    integrityAppAuthUrl: ""

    # ---------------------------------------------------------------------------
    # Service URL Configuration
    # ---------------------------------------------------------------------------

    # -- Integrity Service URL
    # @default -- `""` (auto-generated from global.domain)
    # Public URL for this service
    integrityServiceUrl: ""

    # ---------------------------------------------------------------------------
    # Swagger Configuration
    # ---------------------------------------------------------------------------

    # -- Swagger Base Path
    # @default -- `/integrityService`
    # Base path for Swagger UI
    swaggerBasePath: "/integrityService"

  # =============================================================================
  # SECRETS CONFIGURATION
  # =============================================================================
  secrets:
    # -- Storage Secrets
    # @default -- See values below
    # Only configure the section matching your storage provider
    storage:
      # -- AWS S3 Secret
      # @default -- See values below
      # Only used when integrityAppBlobStoreType is "aws_s3"
      aws_s3:
        # -- Secret Name
        # @default -- `""` (auto-configured from global.secrets.storage.aws_s3.secretName)
        name: ""

      # -- Azure Blob Storage Secret
      # @default -- See values below
      # Only used when integrityAppBlobStoreType is "azure_blob"
      azure_blob:
        # -- Secret Name
        # @default -- `""` (auto-configured from global.secrets.storage.azure_blob.secretName)
        name: ""

      # -- GCS Secret
      # @default -- See values below
      # Only used when integrityAppBlobStoreType is "gcs"
      gcs:
        # -- Secret Name
        # @default -- `""` (auto-configured from global.secrets.storage.gcs.secretName)
        name: ""

# =============================================================================
# PostgreSQL
# =============================================================================
# Bitnami PostgreSQL chart configuration for platform database
# ------------------------------------------------------------------------------
postgresql:
  # -- Enable PostgreSQL
  # @default -- `true`
  # Set to false to use an external PostgreSQL instance
  enabled: true

  # -- Global Storage Class
  # @default -- See values below
  # Storage class configuration for the Bitnami PostgreSQL chart
  global:
    # -- Storage Class
    # @default -- `""` (uses cluster default)
    # Uses cluster default StorageClass when set to ""
    # Override per CSP if needed: EKS="gp3", AKS="managed-csi", GKE="standard", etc
    defaultStorageClass: ""

    postgresql:
      auth:
        # -- Database Name
        # @default -- `governance`
        # Default database for platform services
        database: "governance"

        # -- Database Username
        # @default -- `postgres`
        # PostgreSQL admin username
        username: "postgres"

        # -- Postgres Password
        # @default -- `"placeholder"` (overridden by existingSecret at runtime)
        # This placeholder satisfies Bitnami chart validation during upgrades
        # The actual password is read from existingSecret at runtime
        postgresPassword: "placeholder-overridden-by-secret"

        # -- Existing Secret
        # @default -- `platform-database`
        # References global.secrets.database.secretName
        existingSecret: "platform-database"

        # -- Secret Keys
        # @default -- See values below
        # Keys within the existing secret for password retrieval
        secretKeys:
          # -- Admin Password Key
          # @default -- `password`
          # Key name for PostgreSQL admin password in secret
          adminPasswordKey: "password"

          # -- User Password Key
          # @default -- `password`
          # Key name for regular user password in secret
          userPasswordKey: "password"

  # -- Image Configuration
  # @default -- See values below
  # Bitnami PostgreSQL 17 image
  image:
    # -- Image Registry
    # @default -- `docker.io`
    registry: docker.io

    # -- Image Repository
    # @default -- `bitnamilegacy/postgresql`
    repository: bitnamilegacy/postgresql

    # -- Image Tag
    # @default -- `17-debian-12`
    tag: 17-debian-12

  # -- Primary Instance Configuration
  # @default -- See values below
  # Configuration for the primary PostgreSQL instance
  primary:
    # -- Persistence Configuration
    # @default -- See values below
    persistence:
      # -- Enable Persistence
      # @default -- `true`
      # Enable persistent volume for database data
      enabled: true

      # -- Storage Size
      # @default -- `10Gi`
      # Size of persistent volume for database
      size: 10Gi

    # -- Resource Configuration
    # @default -- See values below
    # CPU and memory resources for PostgreSQL pod
    resources:
      # -- Resource Requests
      # @default -- See values below
      requests:
        # -- CPU Request
        # @default -- `500m`
        cpu: 500m

        # -- Memory Request
        # @default -- `1Gi`
        memory: 1Gi

      # -- Resource Limits
      # @default -- See values below
      limits:
        # -- CPU Limit
        # @default -- `2000m`
        cpu: 2000m

        # -- Memory Limit
        # @default -- `2Gi`
        memory: 2Gi

    # -- Database Initialization
    # @default -- See values below
    # Scripts to run when initializing the database
    # Creates additional databases beyond the default 'governance' database
    initdb:
      # -- Initialization Scripts
      # @default -- See values below
      scripts:
        # -- Create Additional Databases
        # @default -- Creates governance, IntegrityServiceDB, and guardian_gateway databases
        create-additional-dbs.sql: |
          CREATE DATABASE governance;
          GRANT ALL PRIVILEGES ON DATABASE governance TO postgres;

          CREATE DATABASE "IntegrityServiceDB";
          GRANT ALL PRIVILEGES ON DATABASE "IntegrityServiceDB" TO postgres;

          CREATE DATABASE guardian_gateway;
          GRANT ALL PRIVILEGES ON DATABASE guardian_gateway TO postgres;

# ------------------------------------------------------------------------------
# Local kind Diagnostic Profile Guard
# ------------------------------------------------------------------------------
# -- OpenBao kind Profile
# @default -- `false`
# Enforce the opt-in local kind publisher trust/custody contract
# (development-only diagnostics; see examples/values-openbao-kind.yaml)
openbaoKindProfile: false

# =============================================================================
# Auth0 Post-Install Configuration
# =============================================================================
# Configuration for Auth0 identity provider integration
# Creates the necessary organization and admin user in the governance database
# Only used when global.secrets.auth.provider is set to "auth0"
# ------------------------------------------------------------------------------
auth0:
  # -- Create Organization
  # @default -- `false`
  # Enable automatic organization creation for the Auth0 tenant
  # Set to true to create organization in database on install/upgrade
  createOrganization: false

  # -- Organization Name
  # @default -- `governance`
  # Organization identifier in the database
  organizationName: "governance"

  # -- Display Name
  # @default -- `Governance Studio`
  # Human-readable display name for the organization
  displayName: "Governance Studio"

  # -- Create Platform Admin
  # @default -- `false`
  # Create platform-admin user in auth service tables
  # Set to true to create an initial platform administrator
  # The Auth0 user ID is automatically resolved by looking up the user by email via the Management API
  createPlatformAdmin: false

  # -- Platform Admin Email
  # @default -- `""`
  # **REQUIRED** when createPlatformAdmin is true
  # Must be an email address that exists in your Auth0 tenant
  # (typically created during the auth0-bootstrap job)
  # Used to look up the Auth0 user_id automatically via the Management API
  platformAdminEmail: ""

  # -- Domain
  # @default -- `""`
  # **REQUIRED** when createPlatformAdmin is true
  # Auth0 tenant domain (e.g., "yourcompany.us.auth0.com")
  # Used to call the Auth0 Management API for user lookup
  domain: ""

# ------------------------------------------------------------------------------
# Microsoft Entra ID Post-Install Configuration
# ------------------------------------------------------------------------------
# Configuration for Microsoft Entra ID identity provider integration
# Creates the necessary organization and admin user in the governance database
# Only used when global.secrets.auth.provider is set to "entra"
# ------------------------------------------------------------------------------
entra:
  # -- Create Organization
  # @default -- `false`
  # Enable automatic organization creation for Entra tenant
  # Set to true to create organization in database on install/upgrade
  createOrganization: false

  # -- Organization Name
  # @default -- `governance`
  # Organization identifier in the database
  organizationName: "governance"

  # -- Display Name
  # @default -- `Governance Studio`
  # Human-readable display name for the organization
  displayName: "Governance Studio"

  # -- Create Platform Admin
  # @default -- `false`
  # Create platform-admin user in auth service tables
  # Set to true to create an initial platform administrator
  # The Entra user ID is automatically resolved by looking up the user by email via Graph API
  createPlatformAdmin: false

  # -- Platform Admin Email
  # @default -- `""`
  # **REQUIRED** when createPlatformAdmin is true
  # Must be an email address that exists in your Microsoft Entra tenant
  # (e.g., user@yourorg.onmicrosoft.com or user@yourverifieddomain.com)
  # Used to look up the Entra user Object ID automatically via Microsoft Graph API
  platformAdminEmail: ""

  # -- Tenant ID
  # @default -- `""`
  # Microsoft Entra tenant ID (required for Graph API user lookup)
  tenantId: ""

# ------------------------------------------------------------------------------
# Keycloak Post-Install Configuration
# ------------------------------------------------------------------------------
# Configuration for Keycloak identity provider integration
# Creates the necessary organization and admin user in the governance database
# Only used when global.secrets.auth.provider is set to "keycloak"
# ------------------------------------------------------------------------------
keycloak:
  # -- Create Organization
  # @default -- `false`
  # Enable automatic organization creation for Keycloak realm
  # Set to true to create organization in database on install/upgrade
  # Organization name will match the Keycloak realm name
  createOrganization: false

  # -- Realm Name
  # @default -- `governance`
  # Keycloak realm name for the platform
  # Must match auth-service config.idp.keycloak.realm and governance-studio config.keycloakRealm
  # This name is used as the organization identifier in the database
  realmName: "governance"

  # -- Display Name
  # @default -- `Governance Studio`
  # Human-readable display name for the organization
  # Shown in UI and organization management interfaces
  displayName: "Governance Studio"

  # -- Create Platform Admin
  # @default -- `false`
  # Create platform-admin user in auth service tables
  # Set to true to create an initial platform administrator
  # The Keycloak user ID is automatically resolved by looking up the user by email
  createPlatformAdmin: false

  # -- Platform Admin Email
  # @default -- `""` (defaults to admin@<global.domain>)
  # Email address of the platform administrator in Keycloak created during bootstrap
  # Used to look up the Keycloak user ID automatically
  platformAdminEmail: ""

  # -- Keycloak Internal URL
  # @default -- `http://keycloak:8080/keycloak`
  # Internal cluster URL for the Keycloak Admin REST API
  url: "http://keycloak:8080/keycloak"
