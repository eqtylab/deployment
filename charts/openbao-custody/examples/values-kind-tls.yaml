# Three voters on one disposable host: topology simulation, not host-failure HA.
# Keep the wrapper's TLS/Raft/audit settings; DO NOT layer values-dev-kind.yaml.
openbao:
  server:
    dataStorage:
      storageClass: standard
      size: 10Gi
    auditStorage:
      storageClass: standard
      size: 10Gi
    ha:
      replicas: 3
      disruptionBudget:
        maxUnavailable: 1
    affinity: |
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: openbao
                app.kubernetes.io/instance: openbao-custody
                component: server
            topologyKey: kubernetes.io/hostname
