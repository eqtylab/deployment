# Three voters on one disposable host: topology simulation, not host-failure HA.
# Needs a kind cluster with three schedulable nodes; the upstream required
# hostname anti-affinity places one voter per node.
# Keep the wrapper's TLS/Raft/audit settings; DO NOT layer values-dev-kind.yaml.
openbao:
  server:
    dataStorage:
      storageClass: standard
      size: 10Gi
    auditStorage:
      storageClass: standard
      size: 10Gi
    ha:
      replicas: 3
