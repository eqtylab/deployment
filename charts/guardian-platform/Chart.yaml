apiVersion: v2
name: guardian-platform
description: A Helm chart for the complete Guardian Platform.
type: application
version: 1.3.0
appVersion: "1.3.0"
home: https://github.com/eqtylab/guardian-infrastructure
sources:
  - https://github.com/eqtylab/guardian-infrastructure/tree/main/charts/guardian-platform
maintainers:
  - name: EQTY Lab
    email: support@eqtylab.io
dependencies:
  # Auth Service
  - name: auth-service
    version: "1.3.0"
    repository: "file://../auth-service"
    condition: auth-service.enabled
  # Control Plane
  - name: control-plane
    version: "1.3.0"
    repository: "file://../control-plane"
    condition: control-plane.enabled
  # PDFGen
  - name: eqty-pdfgen
    version: "1.3.0"
    repository: "file://../eqty-pdfgen"
    condition: eqty-pdfgen.enabled
  # Governance Service API
  - name: governance-service
    version: "1.3.0"
    repository: "file://../governance-service"
    condition: governance-service.enabled
  # Guardian
  - name: guardian
    version: "1.3.0"
    repository: "file://../guardian"
    condition: guardian.enabled
  # Integrity Service
  - name: integrity-service
    version: "1.3.0"
    repository: "file://../integrity-service"
    condition: integrity-service.enabled
  # LLM Gateway
  - name: llm-gateway
    version: "1.3.0"
    repository: "file://../llm-gateway"
    condition: llm-gateway.enabled
  # HAProxy ingress controller - opt-in, for installs without an existing controller
  - name: kubernetes-ingress
    version: "~1.56.3"
    repository: "oci://ghcr.io/haproxytech/helm-charts"
    alias: haproxyIngress
    condition: haproxyIngress.enabled
  # PostgreSQL - used by auth-service, governance-service, integrity-service, control-plane, and llm-gateway
  - name: postgresql
    version: "~18.1.1" # Bitnami chart version
    repository: "oci://registry-1.docker.io/bitnamicharts"
    alias: postgresql
    condition: postgresql.enabled
