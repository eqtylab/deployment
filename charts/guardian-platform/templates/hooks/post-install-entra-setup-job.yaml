{{- if .Values.entra.createOrganization }}
{{- if .Values.entra.createPlatformAdmin }}
{{- if not .Values.entra.platformAdminEmail }}
{{- fail "entra.platformAdminEmail is required when entra.createPlatformAdmin is true. Must be an email that exists in your Entra tenant." }}
{{- end }}
{{- end }}
{{- $entraSecret := ((((.Values.global).secrets).auth).entra) | default dict }}
{{- $entraSecretKeys := $entraSecret.keys | default dict }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "guardian-platform.fullname" . }}-post-install-entra-setup
  labels:
    {{- include "guardian-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: entra-org-setup
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "20"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "guardian-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: entra-org-setup
    spec:
      restartPolicy: OnFailure
      {{- include "guardian-platform.idpSetup.podSecurityContext" . | nindent 6 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: create-org
          image: {{ include "guardian-platform.idpSetup.image" . }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default "IfNotPresent" }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              {{- include "guardian-platform.idpSetup.shellLib" . | nindent 14 }}

              wait_for_db

              echo "Creating Entra organization..."
              upsert_org

              {{- if .Values.entra.createPlatformAdmin }}

              echo "Creating platform-admin user..."
              ensure_http_tools
              echo "Looking up Entra user by email: $ADMIN_EMAIL"

              if [ -z "$ENTRA_TENANT_ID" ]; then
                echo "ERROR: Entra tenant ID is empty; set entra.tenantId or the tenant ID key in the Entra secret"
                exit 1
              fi

              TOKEN_RESPONSE=$(curl -sS -X POST \
                "https://login.microsoftonline.com/${ENTRA_TENANT_ID}/oauth2/v2.0/token" \
                --data-urlencode "client_id=${ENTRA_CLIENT_ID}" \
                --data-urlencode "client_secret=${ENTRA_CLIENT_SECRET}" \
                --data-urlencode "scope=https://graph.microsoft.com/.default" \
                --data-urlencode "grant_type=client_credentials") || true

              GRAPH_TOKEN=$(printf '%s' "$TOKEN_RESPONSE" | jq -r '.access_token // empty' 2>/dev/null || true)
              if [ -z "$GRAPH_TOKEN" ]; then
                echo "ERROR: Failed to get Graph API access token"
                echo "Response: $TOKEN_RESPONSE"
                exit 1
              fi

              # Match on mail or userPrincipalName; single quotes are doubled for OData
              ODATA_EMAIL=$(printf '%s' "$ADMIN_EMAIL" | sed "s/'/''/g")
              ENTRA_USER=$(curl -sS -G -H "Authorization: Bearer $GRAPH_TOKEN" \
                --data-urlencode "\$filter=mail eq '${ODATA_EMAIL}' or userPrincipalName eq '${ODATA_EMAIL}'" \
                --data-urlencode "\$select=id,mail,displayName,givenName,surname" \
                "https://graph.microsoft.com/v1.0/users") || true

              IDP_USER_ID=$(printf '%s' "$ENTRA_USER" | jq -r '.value[0].id // empty' 2>/dev/null || true)
              if [ -z "$IDP_USER_ID" ]; then
                echo "ERROR: Could not find user with email $ADMIN_EMAIL in Entra tenant"
                echo "Make sure the user exists in your Microsoft Entra ID tenant"
                exit 1
              fi
              echo "Found Entra user ID: $IDP_USER_ID"

              ADMIN_DISPLAY_NAME=$(printf '%s' "$ENTRA_USER" | jq -r '.value[0].displayName // "Platform Admin"')
              ADMIN_GIVEN_NAME=$(printf '%s' "$ENTRA_USER" | jq -r '.value[0].givenName // "Platform"')
              ADMIN_FAMILY_NAME=$(printf '%s' "$ENTRA_USER" | jq -r '.value[0].surname // "Admin"')

              upsert_admin
              {{- end }}

              echo "Setup complete!"
          env:
            {{- include "guardian-platform.idpSetup.pgEnv" . | nindent 12 }}
            - name: IDP_PROVIDER
              value: "entra"
            - name: ORG_NAME
              value: {{ .Values.entra.organizationName | quote }}
            - name: ORG_DISPLAY_NAME
              value: {{ .Values.entra.displayName | default .Values.entra.organizationName | quote }}
            {{- if .Values.entra.createPlatformAdmin }}
            - name: ADMIN_EMAIL
              value: {{ .Values.entra.platformAdminEmail | quote }}
            - name: ENTRA_TENANT_ID
              {{- if .Values.entra.tenantId }}
              value: {{ .Values.entra.tenantId | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ $entraSecret.secretName | default "platform-entra" | quote }}
                  key: {{ $entraSecretKeys.tenantId | default "tenant-id" | quote }}
              {{- end }}
            - name: ENTRA_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $entraSecret.secretName | default "platform-entra" | quote }}
                  key: {{ $entraSecretKeys.graphClientId | default "graph-client-id" | quote }}
            - name: ENTRA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $entraSecret.secretName | default "platform-entra" | quote }}
                  key: {{ $entraSecretKeys.graphClientSecret | default "graph-client-secret" | quote }}
            {{- end }}
          {{- include "guardian-platform.idpSetup.securityContext" . | nindent 10 }}
          {{- include "guardian-platform.idpSetup.volumeMounts" . | nindent 10 }}
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
      # This job should run after the application starts and runs migrations
      initContainers:
        {{- include "guardian-platform.idpSetup.waitForSchema" . | nindent 8 }}
      {{- include "guardian-platform.idpSetup.volumes" . | nindent 6 }}
{{- end }}
