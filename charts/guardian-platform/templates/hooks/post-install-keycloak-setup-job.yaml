{{- if .Values.keycloak.createOrganization }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "guardian-platform.fullname" . }}-post-install-keycloak-setup
  labels:
    {{- include "guardian-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak-org-setup
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "20"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "guardian-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: keycloak-org-setup
    spec:
      restartPolicy: OnFailure
      {{- include "guardian-platform.idpSetup.podSecurityContext" . | nindent 6 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: create-org
          image: {{ include "guardian-platform.idpSetup.image" . }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default "IfNotPresent" }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              {{- include "guardian-platform.idpSetup.shellLib" . | nindent 14 }}

              wait_for_db

              echo "Creating Keycloak organization..."
              upsert_org

              {{- if .Values.keycloak.createPlatformAdmin }}

              echo "Creating platform-admin user..."
              ensure_http_tools
              echo "Looking up Keycloak user by email: $ADMIN_EMAIL"

              KC_TOKEN=$(curl -sS -X POST "${KEYCLOAK_URL}/realms/master/protocol/openid-connect/token" \
                --data-urlencode "username=${KEYCLOAK_ADMIN_USERNAME}" \
                --data-urlencode "password=${KEYCLOAK_ADMIN_PASSWORD}" \
                --data-urlencode "grant_type=password" \
                --data-urlencode "client_id=admin-cli" | jq -r '.access_token // empty') || true

              if [ -z "$KC_TOKEN" ]; then
                echo "ERROR: Failed to get Keycloak admin token from ${KEYCLOAK_URL}"
                echo "Check keycloak.url, keycloak.adminUsername and keycloak.adminPasswordSecret"
                exit 1
              fi

              REALM_PATH=$(jq -rn --arg realm "$ORG_NAME" '$realm | @uri')
              KC_USER=$(curl -sS -G -H "Authorization: Bearer $KC_TOKEN" \
                --data-urlencode "email=${ADMIN_EMAIL}" \
                --data-urlencode "exact=true" \
                "${KEYCLOAK_URL}/admin/realms/${REALM_PATH}/users") || true

              IDP_USER_ID=$(printf '%s' "$KC_USER" | jq -r '.[0].id // empty' 2>/dev/null || true)
              if [ -z "$IDP_USER_ID" ]; then
                echo "ERROR: Could not find user with email $ADMIN_EMAIL in Keycloak realm '${ORG_NAME}'"
                echo "keycloak.platformAdminEmail must match the admin email created by keycloak-bootstrap (users.admin.email)"
                exit 1
              fi
              echo "Found Keycloak user ID: $IDP_USER_ID"

              # Empty Keycloak profile fields count as missing
              ADMIN_GIVEN_NAME=$(printf '%s' "$KC_USER" | jq -r '(.[0].firstName // "") | if . == "" then "Platform" else . end')
              ADMIN_FAMILY_NAME=$(printf '%s' "$KC_USER" | jq -r '(.[0].lastName // "") | if . == "" then "Admin" else . end')
              ADMIN_DISPLAY_NAME=$(printf '%s' "$KC_USER" | jq -r '.[0]
                | ([.firstName, .lastName] | map(select(. != null and . != "")) | join(" ")) as $name
                | if $name != "" then $name elif (.username // "") != "" then .username else "Platform Admin" end')

              upsert_admin
              {{- end }}

              echo "Setup complete!"
          env:
            {{- include "guardian-platform.idpSetup.pgEnv" . | nindent 12 }}
            - name: IDP_PROVIDER
              value: "keycloak"
            - name: ORG_NAME
              value: {{ .Values.keycloak.realmName | quote }}
            - name: ORG_DISPLAY_NAME
              value: {{ .Values.keycloak.displayName | default .Values.keycloak.realmName | quote }}
            {{- if .Values.keycloak.createPlatformAdmin }}
            - name: ADMIN_EMAIL
              value: {{ .Values.keycloak.platformAdminEmail | default (printf "admin@%s" .Values.global.domain) | quote }}
            - name: KEYCLOAK_URL
              value: {{ .Values.keycloak.url | default "http://keycloak:8080/keycloak" | quote }}
            - name: KEYCLOAK_ADMIN_USERNAME
              value: {{ .Values.keycloak.adminUsername | default "admin" | quote }}
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ ((.Values.keycloak.adminPasswordSecret).name) | default "keycloak-admin" | quote }}
                  key: {{ ((.Values.keycloak.adminPasswordSecret).key) | default "password" | quote }}
            {{- end }}
          {{- include "guardian-platform.idpSetup.securityContext" . | nindent 10 }}
          {{- include "guardian-platform.idpSetup.volumeMounts" . | nindent 10 }}
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
      # This job should run after the application starts and runs migrations
      initContainers:
        {{- include "guardian-platform.idpSetup.waitForSchema" . | nindent 8 }}
      {{- include "guardian-platform.idpSetup.volumes" . | nindent 6 }}
{{- end }}
