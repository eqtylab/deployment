{{- if .Values.openbaoKindProfile }}
{{- $llmGateway := index .Values "llm-gateway" }}
{{- $controlPlane := index .Values "control-plane" }}
{{- $keyID := required "local kind profile requires control-plane.config.plugins.publisherSigner.keyID" $controlPlane.config.plugins.publisherSigner.keyID }}
{{- $_ := required "local kind profile requires control-plane.secrets.pluginPublisherSigner.name" $controlPlane.secrets.pluginPublisherSigner.name }}
{{- $gatewayKey := index $llmGateway.config.plugins.trustedSignerKeys $keyID | default "" }}
{{- $controlPlaneKey := index $controlPlane.config.plugins.trustedSignerKeys $keyID | default "" }}
{{- if or (empty $gatewayKey) (ne $gatewayKey $controlPlaneKey) }}
{{- fail "local kind profile requires matching publisher public keys in LLM Gateway and Control Plane trustedSignerKeys" }}
{{- end }}
{{- if or (not (regexMatch "^[A-Za-z0-9+/]{43}=$" $gatewayKey)) (ne (len (b64dec $gatewayKey)) 32) }}
{{- fail "local kind publisher public key must be a base64-encoded 32-byte Ed25519 public key" }}
{{- end }}
{{- $integrity := index .Values "integrity-service" }}
{{- if ne $controlPlane.config.adapter.integrityBaseURL $integrity.config.integrityServiceUrl }}
{{- fail "local kind Control Plane integrityBaseURL must match the Integrity public status URL" }}
{{- end }}
{{- $statusHostAlias := false }}
{{- range $alias := $controlPlane.hostAliases }}
{{- if has "guardian.local.test" $alias.hostnames }}
{{- $statusHostAlias = true }}
{{- end }}
{{- end }}
{{- if not $statusHostAlias }}
{{- fail "local kind Control Plane requires a guardian.local.test hostAlias for the trusted status origin" }}
{{- end }}
{{- end }}
