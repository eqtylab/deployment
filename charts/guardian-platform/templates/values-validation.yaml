{{- if hasKey .Values "governance-studio" }}
{{- fail "Guardian's values moved from governance-studio: to guardian:. Rename the key. On an existing install, keep its release and namespace, and set nameOverride: governance-platform and guardian.nameOverride: governance-studio to keep its resource names" }}
{{- end }}
{{- if hasKey .Values "gateway-stack" }}
{{- fail "The gateway-stack chart was split into llm-gateway and control-plane. Move gateway-stack.llmGateway.* to llm-gateway.*, gateway-stack.controlPlane.* to control-plane.*, and gateway-stack.haproxyIngress to haproxyIngress; charts/llm-gateway/README.md and charts/control-plane/README.md map each key" }}
{{- end }}
{{- $databaseSecret := ((((.Values.global).secrets).database).secretName) | default "" }}
{{- if and ((.Values.global).secrets).create $databaseSecret (ne $databaseSecret "platform-database") }}
{{- $postgresAuth := ((((.Values.postgresql).global).postgresql).auth) | default dict }}
{{- if and (.Values.postgresql).enabled (ne ($postgresAuth.existingSecret | default "") $databaseSecret) }}
{{- fail (printf "global.secrets.database.secretName is %q but postgresql.global.postgresql.auth.existingSecret is %q; set it to %q so the bundled PostgreSQL reads the Secret the chart creates" $databaseSecret ($postgresAuth.existingSecret | default "") $databaseSecret) }}
{{- end }}
{{- end }}
{{- $gatewayDsnKey := (((((.Values.global).secrets).database).keys).gatewayDsn) | default "" }}
{{- range $chart := list "control-plane" "llm-gateway" }}
{{- $values := index $.Values $chart | default dict }}
{{- $dsn := (($values.externalDatabase).dsnSecretKeyRef) | default dict }}
{{- if and (($.Values.global).secrets).create $values.enabled (has ($dsn.name | default "") (list "" $databaseSecret)) $dsn.key (ne $dsn.key $gatewayDsnKey) }}
{{- fail (printf "global.secrets.database.keys.gatewayDsn is %q but %s.externalDatabase.dsnSecretKeyRef.key is %q; set it to %q, or leave it empty, so %s reads the key the chart writes" $gatewayDsnKey $chart $dsn.key $gatewayDsnKey $chart) }}
{{- end }}
{{- end }}
{{- $controlPlane := index .Values "control-plane" | default dict }}
{{- $llmGateway := index .Values "llm-gateway" | default dict }}
{{- $registration := (($llmGateway.config).registration) | default dict }}
{{- $platformControlPlaneSecret := ((((.Values.global).secrets).controlPlane).secretName) | default "" }}
{{- $controlPlaneSecret := ((($controlPlane.secrets).controlPlane).name) | default $platformControlPlaneSecret }}
{{- $llmGatewaySecret := ((($llmGateway.secrets).controlPlane).name) | default $platformControlPlaneSecret }}
{{- if and $controlPlane.enabled $llmGateway.enabled $registration.enabled (ne $controlPlaneSecret $llmGatewaySecret) }}
{{- fail (printf "control-plane reads the registration token from Secret %q but llm-gateway reads it from %q; set global.secrets.controlPlane.secretName and leave both secrets.controlPlane.name values empty so they read the same Secret" $controlPlaneSecret $llmGatewaySecret) }}
{{- end }}
{{- $controlPlaneIssuer := ((($controlPlane.config).auth).registrationTokenIssuer) | default "control-plane" }}
{{- if and $controlPlane.enabled $llmGateway.enabled $registration.enabled (ne ($registration.tokenIssuer | default "control-plane") $controlPlaneIssuer) }}
{{- fail (printf "llm-gateway.config.registration.tokenIssuer is %q but control-plane.config.auth.registrationTokenIssuer is %q; set them to the same value" ($registration.tokenIssuer | default "control-plane") $controlPlaneIssuer) }}
{{- end }}
{{- $fullname := include "guardian-platform.fullname" . }}
{{- $hooks := dict "keycloak" .Values.keycloak.createOrganization "auth0" .Values.auth0.createOrganization "entra" .Values.entra.createOrganization }}
{{- range $idp, $enabled := $hooks }}
{{- $job := printf "%s-post-install-%s-setup" $fullname $idp }}
{{- if and $enabled (gt (len $job) 63) }}
{{- fail (printf "Job name %s is %d characters; Kubernetes allows 63. Set nameOverride or fullnameOverride to shorten it; an existing governance-platform release sets nameOverride: governance-platform" $job (len $job)) }}
{{- end }}
{{- end }}
