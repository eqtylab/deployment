{{- if hasKey .Values "governance-studio" }}
{{- fail "Guardian's values moved from governance-studio: to guardian:. Rename the key. On an existing install, keep its release and namespace, and set nameOverride: governance-platform and guardian.nameOverride: governance-studio to keep its resource names" }}
{{- end }}
{{- $fullname := include "guardian-platform.fullname" . }}
{{- $hooks := dict "keycloak" .Values.keycloak.createOrganization "auth0" .Values.auth0.createOrganization "entra" .Values.entra.createOrganization }}
{{- range $idp, $enabled := $hooks }}
{{- $job := printf "%s-post-install-%s-setup" $fullname $idp }}
{{- if and $enabled (gt (len $job) 63) }}
{{- fail (printf "Job name %s is %d characters; Kubernetes allows 63. Set nameOverride or fullnameOverride to shorten it; an existing governance-platform release sets nameOverride: governance-platform" $job (len $job)) }}
{{- end }}
{{- end }}
