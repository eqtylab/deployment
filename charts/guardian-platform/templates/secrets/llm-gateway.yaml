# Enablement Check
{{- $llmGateway := index .Values "llm-gateway" }}
{{- $usesPlatformSecret := and $llmGateway.enabled (has ($llmGateway.secrets.llmGateway.name | default "") (list "" .Values.global.secrets.llmGateway.secretName)) }}
{{- $writesSeed := and $usesPlatformSecret $llmGateway.config.registration.enabled }}
{{- $writesPluginSecretEnvs := and $usesPlatformSecret $llmGateway.config.plugins.enabled (not (empty .Values.global.secrets.llmGateway.values.pluginSecretEnvs)) }}
{{- if and .Values.global.secrets.create (or $writesSeed $writesPluginSecretEnvs) }}

# Data Validation
{{- if not .Values.global.secrets.llmGateway.secretName }}
  {{- fail "global.secrets.llmGateway.secretName is required when llm-gateway registration or plugin secret environment variables are enabled and create is true" }}
{{- end }}
{{- if and $writesSeed (not .Values.global.secrets.llmGateway.values.credentialSignerSeed) }}
  {{- fail "global.secrets.llmGateway.values.credentialSignerSeed is required when llm-gateway.config.registration.enabled is true and create is true" }}
{{- end }}
{{- range $name, $_ := .Values.global.secrets.llmGateway.values.pluginSecretEnvs }}
{{- if not (regexMatch "^[A-Za-z_][A-Za-z0-9_]*$" $name) }}
  {{- fail (printf "global.secrets.llmGateway.values.pluginSecretEnvs key %q is not a valid environment variable name" $name) }}
{{- end }}
{{- end }}

# Secret Resource
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.secrets.llmGateway.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "guardian-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $writesSeed }}
  {{ .Values.global.secrets.llmGateway.keys.credentialSignerSeed }}: {{ .Values.global.secrets.llmGateway.values.credentialSignerSeed | quote }}
  {{- end }}
  {{- if $writesPluginSecretEnvs }}
  {{- range $name := keys .Values.global.secrets.llmGateway.values.pluginSecretEnvs | sortAlpha }}
  {{ $name }}: {{ index $.Values.global.secrets.llmGateway.values.pluginSecretEnvs $name | quote }}
  {{- end }}
  {{- end }}
{{- end }}
