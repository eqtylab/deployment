# Enablement Check
{{- $controlPlane := index .Values "control-plane" }}
{{- $controlPlaneUsesPlatformSecret := and $controlPlane.enabled $controlPlane.config.auth.enabled (has ($controlPlane.secrets.controlPlane.name | default "") (list "" .Values.global.secrets.controlPlane.secretName)) }}
{{- if and .Values.global.secrets.create (or $controlPlaneUsesPlatformSecret (and (index .Values "gateway-stack" "enabled") (index .Values "gateway-stack" "llmGateway" "registration" "enabled"))) }}

# Data Validation
{{- if not .Values.global.secrets.controlPlane.secretName }}
  {{- fail "global.secrets.controlPlane.secretName is required when control-plane.config.auth.enabled or gateway-stack.llmGateway.registration.enabled is true and create is true" }}
{{- end }}
{{- if not .Values.global.secrets.controlPlane.values.registrationTokenSecret }}
  {{- fail "global.secrets.controlPlane.values.registrationTokenSecret is required when control-plane.config.auth.enabled or gateway-stack.llmGateway.registration.enabled is true and create is true" }}
{{- end }}

# Secret Resource
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.secrets.controlPlane.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "guardian-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.global.secrets.controlPlane.keys.registrationTokenSecret }}: {{ .Values.global.secrets.controlPlane.values.registrationTokenSecret | quote }}
{{- end }}
