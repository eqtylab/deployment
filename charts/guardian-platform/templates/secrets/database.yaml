# Enablement Check
{{- if .Values.global.secrets.create }}
{{- $controlPlane := index .Values "control-plane" }}
{{- $llmGateway := index .Values "llm-gateway" }}
{{- $controlPlaneUsesPlatformSecret := and $controlPlane.enabled (eq ($controlPlane.externalDatabase.dsnSecretKeyRef.name | default .Values.global.secrets.database.secretName) .Values.global.secrets.database.secretName) }}
{{- $llmGatewayUsesPlatformSecret := and $llmGateway.enabled (eq ($llmGateway.externalDatabase.dsnSecretKeyRef.name | default .Values.global.secrets.database.secretName) .Values.global.secrets.database.secretName) }}
{{- $writesGatewayDsn := or $controlPlaneUsesPlatformSecret $llmGatewayUsesPlatformSecret }}

# Data Validation
{{- if not .Values.global.secrets.database.secretName }}
  {{- fail "global.secrets.database.secretName is required when create is true" }}
{{- end }}
{{- if not .Values.global.secrets.database.values.username }}
  {{- fail "global.secrets.database.values.username is required when create is true" }}
{{- end }}
{{- if not .Values.global.secrets.database.values.password }}
  {{- fail "global.secrets.database.values.password is required when create is true" }}
{{- end }}
{{- if and $writesGatewayDsn (not .Values.global.secrets.database.values.gatewayDsn) }}
  {{- fail "global.secrets.database.values.gatewayDsn is required when create and control-plane or llm-gateway are enabled" }}
{{- end }}

# Secret Resource
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.secrets.database.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "guardian-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Standard keys (used by platform services)
  {{ .Values.global.secrets.database.keys.username }}: {{ .Values.global.secrets.database.values.username | quote }}
  {{ .Values.global.secrets.database.keys.password }}: {{ .Values.global.secrets.database.values.password | quote }}
  {{- if $writesGatewayDsn }}
  {{ .Values.global.secrets.database.keys.gatewayDsn }}: {{ .Values.global.secrets.database.values.gatewayDsn | quote }}
  {{- end }}
{{- end }}
