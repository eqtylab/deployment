# Enablement Check
{{- if .Values.global.secrets.create }}

# Data Validation
{{- if not .Values.global.secrets.imageRegistry.secretName }}
  {{- fail "global.secrets.imageRegistry.secretName is required when create is true" }}
{{- end }}
{{- if not .Values.global.secrets.imageRegistry.registry }}
  {{- fail "global.secrets.imageRegistry.registry is required when create is true" }}
{{- end }}
{{- if not .Values.global.secrets.imageRegistry.values.username }}
  {{- fail "global.secrets.imageRegistry.values.username is required when create is true" }}
{{- end }}
{{- if not .Values.global.secrets.imageRegistry.values.password }}
  {{- fail "global.secrets.imageRegistry.values.password is required when create is true" }}
{{- end }}

# Variable Assignment
{{- $registry := .Values.global.secrets.imageRegistry.registry | toString }}
{{- $username := .Values.global.secrets.imageRegistry.values.username | toString }}
{{- $password := .Values.global.secrets.imageRegistry.values.password | toString }}
{{- $email := .Values.global.secrets.imageRegistry.values.email | default "" | toString }}
{{- $auth := printf "%s:%s" $username $password | b64enc }}
{{- $credentials := dict "username" $username "password" $password "email" $email "auth" $auth }}
{{- $dockerConfig := dict "auths" (dict $registry $credentials) }}

# Secret Resource
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.secrets.imageRegistry.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "guardian-platform.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ $dockerConfig | toJson | b64enc }}
{{- end }}
