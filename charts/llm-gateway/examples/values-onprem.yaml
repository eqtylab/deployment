# On-Premises LLM Gateway Configuration Example
# Demonstrates an air-gapped install with an internal registry mirror, an
# external database, S3-compatible plugin artifact storage, and pre-issued TLS
# certificates
# For all available values, see the chart's values.yaml and README.md
#
# Usage:
#   Set these values under the `llm-gateway:` key in your umbrella values file
#
# Replace every example.internal hostname before deploying

global:
  # Point the LLM Gateway image at an internal mirror
  imageRegistryOverride: registry.example.internal

enabled: true

image:
  tag: ""
  pullPolicy: IfNotPresent

ingress:
  enabled: true
  className: ""
  hosts:
    - host: "gateway.example.internal"
      paths:
        - path: "/"
          pathType: "Prefix"
  # Pre-issued certificate
  tls:
    - secretName: "guardian-gateway-tls"
      hosts:
        - "gateway.example.internal"

# Pre-created Secret holding the guardian_gateway DSN under dsn
externalDatabase:
  dsnSecretKeyRef:
    name: "guardian-db"
    key: "dsn"

config:
  deploymentEnvironment: "production"
  upstreams:
    anthropicURL: "https://api.anthropic.com"
    openaiURL: "https://api.openai.com"

  plugins:
    enabled: true
    pollInterval: "15s"
    artifactStorage:
      provider: "s3"
      bucket: "guardian-plugin-artifacts"
      prefix: "production"
      s3:
        endpoint: "https://s3.example.internal"
        region: "us-east-1"
        forcePathStyle: true
    trustedSignerKeys:
      signer-onprem: "did:key:z6MksM27vR5Rdxi4BgF3mG7qbQ8x1xWmA2oxRjzT51r9bYEv"

secrets:
  pluginArtifactStorage:
    s3:
      name: "guardian-artifact-s3"
